function reroll(){const d=S.draft;if(S.rerolls<1)return;S.rerolls--;d.offers=dealOffers(d.boss);d.anim=true;S.mind.rerolls++;if(S.mind.rerolls>=3&&!S.mind.said.reroller){S.mind.said.reroller=1;d.line=voice('reroller');}SFX.shuffle();renderDraft();}
const sellVal=inst=>Math.max(1,Math.floor(inst.price/2));
const inShop=()=>!$('ov').hidden&&S.draft&&S.pending==null&&!!$('ov').querySelector('.neon');
function refresh(){if(inShop())renderDraft();else render();}
function sellPerk(idx){const inst=S.perks[idx];S.money+=sellVal(inst);S.perks.splice(idx,1);SFX.coin();refresh();}
function sellCons(idx){S.cons.splice(idx,1);S.money+=1;SFX.coin();refresh();}
function useCons(idx){
  const id=S.cons[idx],C=CON[id],R=S.round;if(!C)return;
  if(C.when==='round'&&!(R&&R.phase==='player'))return;
  const msg=C.use(R);if(!msg){fxCenter('NOTHING TO HIT',MUC);return;}
  S.cons.splice(idx,1);SFX.use();if(S.mind)S.mind.cards++;closeSheet();
  if(R&&R.phase==='player'){R.legal=legalMoves(R.board,R.pc);R.sel=null;R.cands=null;}
  refresh();fxCenter(msg,CYAN);if(R&&R.phase==='player')dealerSay('card');
}

/* ===== main menu ===== */

function midV(r){const v={};for(const k in r){const[lo,hi,st=1]=r[k];const steps=Math.round((hi-lo)/st);v[k]=+(lo+Math.round(steps/2)*st).toFixed(2);}return v;}

        return`<button class="seat ${MENU.seat===x.id?'sel':''} ${ok?'':'locked'}" ${ok?`onclick="MENU.seat='${x.id}';SFX.click();renderMenu()"`:'disabled'}><b>${x.name}</b><span>${x.desc}</span>${ok?'':`<span class="lk">${trf('Locked: {0}',tr(x.lock))}</span>`}</button>`;}).join('')}</div>
      <h3 class="mstep">3. Pick the heat</h3><div class="mheat">${HEATS.map((x,i)=>`<button class="hchip ${MENU.heat===i?'sel':''}" ${i>(SAVE.heatMax||0)?'disabled':''} onclick="MENU.heat=${i};SFX.click();renderMenu()">${i}</button>`).join('')}</div>
      <p class="lab" style="text-align:center">${MENU.heat?HEATS.slice(1,MENU.heat+1).map(x=>tr(x[1])).join(' '):tr(HEATS[0][1])} ${(SAVE.heatMax||0)<5?trf('Win on Heat {0} to unlock the next one.',SAVE.heatMax||0):''}</p>
      <div class="mstart"><button class="btn pink big" onclick="startRun({mode:MENU.mode,seat:MENU.seat,heat:MENU.heat})">Deal me in</button></div>`;}
  else if(v==='daily'){const c=dailyCfg(),dd=SAVE.daily[c.daily];
    h=mHead('Daily Deal')+`<div class="mpanel centered"><p class="lab">${fdate(c.daily)}</p><p style="font-size:16px">${trf('Everyone gets the same seeded run today: Classic Run on Heat 1, seated as {0}.',`<b>${tr(SEAT[c.seat].name)}</b>`)}</p>
      <p class="lab">${SEAT[c.seat].desc}</p><p>${dd?trf('Your best today: {0}',dd.won?`<b class="d">${tr('Won')}</b>`:trf('Ante {0}',dd.ante)):tr('No attempt yet today.')}</p>

  else if(v==='collection'){const tab=MENU.tab,lists={perk:PERKS,item:ITEMS,cons:CONS},list=lists[tab],seen=SAVE.seen[tab];

      <div class="cgrid">${list.map(x=>{if(!seen.includes(x.id))return`<div class="card unseen rc-common"><div class="qmark bang">?</div><div class="nm bang ol">???</div><div class="ds lab">Not found yet. It shows up in a Deal.</div></div>`;
        if(tab==='perk')return perkCard({id:x.id,v:midV(x.r),q:.5,n:0},{act:''});if(tab==='item')return itemCard({id:x.id,v:midV(x.r),q:.5},{act:''});return consCard(x.id,{act:''});}).join('')}</div>
      <p class="lab" style="text-align:center">Numbers shown are typical rolls. Every copy rolls its own.</p>`;}
  else if(v==='records'){const st=SAVE.stats;
    h=mHead('Records')+`<div class="stats">${[['Runs',st.runs],['Wins',st.wins],['Best ante',st.bestAnte||'-'],['Best Double Cross hand',st.crossHands||'-'],['Biggest move',fmt(st.bestMove||0)],['Fastest win',st.fastest?fmtT(st.fastest):'-'],['Heat unlocked',SAVE.heatMax||0],['Seats',SAVE.seats.length+' / '+SEATS.length],['He sees you as',REL_NAME[relOf()]],['His respect',(SAVE.mind.respect||20)+' / 100'],['Promises kept',SAVE.mind.kept.length],['Promises broken',SAVE.mind.contra.length]].map(([a,b])=>`<div class="stat"><span class="lab">${a}</span><b>${b}</b></div>`).join('')}</div>
      <h3 class="mstep">Seats</h3><div class="mseats">${SEATS.map(x=>{const ok=SAVE.seats.includes(x.id);return`<div class="seat ${ok?'':'locked'}"><b>${x.name}</b><span>${x.desc}</span>${ok?'':`<span class="lk">${trf('Locked: {0}',tr(x.lock))}</span>`}</div>`;}).join('')}</div>
      <h3 class="mstep">Recent runs</h3>${SAVE.hist.length?`<div class="mpanel" style="padding:8px 12px;overflow-x:auto"><table class="hist">${SAVE.hist.map(r=>`<tr><td>${fdate(r.d)}</td><td>${tr(r.mode==='cross'?'Double Cross':'Classic')}${r.daily?' '+tr('(daily)'):''}</td><td>${SEAT[r.seat]?tr(SEAT[r.seat].name):''}</td><td>${trf('Heat {0}',r.heat)}</td><td>${r.won?`<b class="d">${tr('Won')}</b>`:r.mode==='cross'?trf('Hand {0}',r.hand):trf('Ante {0}',r.ante)}</td></tr>`).join('')}</table></div>`:'<p class="lab">No runs yet.</p>'}`;}
  else if(v==='credits'){
    h=mHead('Credits')+`<div class="mpanel credits centered">
      <div class="cr-role">A game by</div><div class="cr-name bang ol">Ramtin Mohammadi</div>

      <div class="cr-role">Made with</div><div class="cr-name2 bang">Vira Engine</div>
      <div class="cr-role">Words he lives by</div><p>His speeches are original lines inspired by thirty classic stories, and by Epictetus, Seneca, Marcus Aurelius, Heraclitus, Socrates, Lao Tzu, Pascal, Kierkegaard and Saadi.</p>

  else if(v==='howto'){
    h=mHead('How to play')+`<div class="mpanel howto">

      <h3 class="mstep">Scoring</h3><p>Every move scores Chips × Mult. The piece you move sets the base. Captures, checks, promotions, perks, items and enhancements add on top. Past 15 Mult, the House limit squeezes the extra.</p>

      <h3 class="mstep">The Deal</h3><p>Perks (5 slots), items (no limit, copies stack), tricks (3 slots, each one used once) and upgrades all come from the Deal, and everything costs coins. Rerolls are tokens: you start with 2 and every boss pays out one more. Cards can roll Enhanced.</p>
      <h3 class="mstep">The table</h3><p>In Classic the board carries on between blinds. When either side is down to 5 pieces, the table resets and you swap colors. In Double Cross the table turns after every hand and you play the side you were fighting.</p>

      <h3 class="mstep">Replay</h3><p>Win to unlock new seats and higher heat. Every seat changes how a run starts, every heat makes the table meaner, and the Daily Deal gives everyone the same seeded run each day.</p></div>`;}
  $('menu').innerHTML=`<div class="mwrap view-${v}">${h}</div>`;

/* ===== options + input ===== */
function updOpts(){
  for(const k of['sfx','amb','fast']){const b=$('o-'+k);if(b)b.classList.toggle('on',OPT[k]);}
  document.documentElement.style.setProperty('--spd',OPT.fast?.5:1);
}
function toggleOpt(k){OPT[k]=!OPT[k];audioInit();if(k==='amb'){OPT.amb?startAmb():stopAmb();}SAVE.opt=Object.assign({},OPT);persist();updOpts();}
$('board').addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const sq=e.target.closest('.sq');if(!sq)return;e.preventDefault();clickSq(+sq.dataset.sq);});
document.addEventListener('pointerdown',audioInit);
$('board').addEventListener('click',e=>{const t=e.target.closest('.sq');if(t)clickSq(+t.dataset.sq);});
setInterval(()=>{const el=$('runClock');if(el&&S)el.textContent=clockStr();},1000);
function fit(){
  const col=$('tablecol'),st=$('status');if(!col)return;
  const compact=innerWidth<=980||innerHeight<660,land=compact&&innerWidth>innerHeight*1.15,b=document.body;
  if(b.classList.contains('compact')!==compact||b.classList.contains('cm-land')!==land){b.classList.toggle('compact',compact);b.classList.toggle('cm-port',compact&&!land);b.classList.toggle('cm-land',land);if(S&&S.round)renderHud();}
  const w=col.clientWidth;
  let bw=Math.min(w-(compact?18:24),col.clientHeight-st.offsetHeight-(compact?22:34));
  bw=Math.max(compact?180:240,Math.min(820,Math.floor(bw)));
  if(fit.last!==bw){fit.last=bw;document.documentElement.style.setProperty('--bw',bw+'px');}
}
addEventListener('resize',fit);
if(window.ResizeObserver)new ResizeObserver(()=>fit()).observe($('tablecol'));
$('brand').innerHTML=logoSVG('');
if(SAVE.opt)Object.assign(OPT,SAVE.opt);OPT.amb=false;
$('dlg').addEventListener('click',skipSay);
$('board').addEventListener('pointerdown',e=>fxRipple(e.clientX,e.clientY));
{let lh=0;const hov=window.matchMedia&&window.matchMedia('(hover:hover)').matches;
 document.addEventListener('pointerover',e=>{if(!hov)return;const t=e.target.closest&&e.target.closest('.sq.tg,.sq[tabindex],.mbtn,.mbig,.seat,.hchip,.card .btn,.mode');if(!t)return;const n=Date.now();if(n-lh<70)return;lh=n;SFX.hover();});}
(function ambient(){const c=$('amb');let x=null;try{x=c.getContext&&c.getContext('2d');}catch(e){}if(!x)return;let W=0,H=0;const drops=[],motes=[];
  const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight;};rs();addEventListener('resize',rs);
  for(let i=0;i<70;i++)drops.push({x:NR()*W,y:NR()*H,l:8+NR()*16,v:6+NR()*7});
  for(let i=0;i<26;i++)motes.push({x:NR()*W,y:NR()*H,r:.6+NR()*1.8,v:.15+NR()*.35,h:NR()<.5?'255,79,94':'67,230,213'});
  const still=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const f=()=>{if(!document.hidden){x.clearRect(0,0,W,H);{x.strokeStyle='rgba(180,200,255,.13)';x.lineWidth=1;x.beginPath();
      for(const d of drops){x.moveTo(d.x,d.y);x.lineTo(d.x-d.l*.25,d.y+d.l);if(!still){d.y+=d.v;d.x-=d.v*.25;if(d.y>H){d.y=-20;d.x=NR()*W*1.2;}}}x.stroke();}
    for(const m of motes){x.fillStyle=`rgba(${m.h},.35)`;x.beginPath();x.arc(m.x,m.y,m.r,0,7);x.fill();if(!still){m.y-=m.v;if(m.y<-5){m.y=H+5;m.x=NR()*W;}}}}
    if(!still)requestAnimationFrame(f);};f();})();
updOpts();
showMenu();
</script>
