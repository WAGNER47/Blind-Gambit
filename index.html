ی. تا این‌جا حس بردن همین است؟","You said you came to learn. What did that last move teach you?":"گفتی برای یاد گرفتن آمده‌ای. آن حرکت آخر چه به تو آموخت؟","You came here to forget something. It is still with you. I can see it in how you move.":"آمدی این‌جا تا چیزی را فراموش کنی. هنوز همراه توست. در حرکت‌هایت می‌بینمش.","Forget what? Something you did, or something somebody did to you?":"فراموش کردن چی؟ کاری که خودت کردی، یا کاری که یکی با تو کرد؟","Is it something you did, or something that was done to you?":"کاری است که خودت کرده‌ای، یا کاری که با تو کرده‌اند؟","Something I did":"کاری که خودم کردم","Something done to me":"کاری که با من کردند","I'd rather not say":"ترجیح می‌دهم نگویم","you carry something you did":"بار کاری را که خودت کردی به دوش می‌کشی","you carry something that was done to you":"بار کاری را که با تو کردند به دوش می‌کشی","you keep what you carry to yourself":"آنچه را به دوش می‌کشی پیش خودت نگه می‌داری","Ah. Guilt. Classic. Me too. I once resigned a won game. Kidding. I never resign.":"آه. عذاب وجدان. کلاسیکه. منم همین‌طور. یه بار یه بازی بُرده رو واگذار کردم. شوخی کردم. من هیچ‌وقت واگذار نمی‌کنم.","That's not fair. I don't like that. Okay. Play. I'll go easy. That's a lie, but I'll feel bad.":"این منصفانه نیست. خوشم نمیاد. باشه. بازی کن. بهت آسون می‌گیرم. دروغ گفتم، ولی عذاب وجدان می‌گیرم.","Fine. Keep your secrets. I keep mine in my rating.":"باشه. رازهات مال خودت. من رازهامو تو ریتینگم نگه می‌دارم.","Then you already know what a mistake costs. That knowledge is heavy, but it is also how people learn to be kind.":"پس از پیش می‌دانی بهای یک اشتباه چیست. این دانستن سنگین است، اما آدم‌ها همین‌گونه مهربانی را می‌آموزند.","Then none of it was your move. Remember that the next time you blame yourself for the whole board.":"پس هیچ‌کدامش حرکتِ تو نبود. دفعهٔ بعد که خودت را برای کل صفحه سرزنش کردی، این را به یاد بیاور.","That is allowed. Some things are not meant to be told at a table. Play, and let it rest for a while.":"اشکالی ندارد. بعضی چیزها برای گفتن سر میز نیستند. بازی کن، و بگذار مدتی آرام بگیرد.","What scares you more: losing to me, or never trying? Trick question. It's me.":"از کدوم بیشتر می‌ترسی: باختن به من، یا هیچ‌وقت تلاش نکردن؟ سؤال انحرافی بود. از من.","Tell me honestly. What frightens you more: losing, or never trying?":"صادقانه بگو. چه چیزی بیشتر می‌ترساندت: باختن، یا هرگز تلاش نکردن؟","Losing":"باختن","Never trying":"تلاش نکردن","Neither":"هیچ‌کدام","losing scares you most":"بیش از همه از باختن می‌ترسی","never trying scares you more than losing":"از تلاش نکردن بیشتر از باختن می‌ترسی","nothing scares you":"از هیچ‌چیز نمی‌ترسی","Correct. I'm terrifying.":"درسته. من وحشتناکم.","Wow, deep. Did you get that from a poster?":"وای، چه عمیق. اینو از رو پوستر خوندی؟","Neither? Liar. Everybody's scared. I'm scared right now. Of nothing. Moving on.":"هیچ‌کدوم؟ دروغگو. همه می‌ترسن. منم همین الان می‌ترسم. از هیچی. بریم سراغ بعدی.","Then you already know the price of playing safe. It is the life you did not live.":"پس بهای محتاط بازی کردن را می‌دانی. همان زندگی‌ای است که نزیستی.","Good. Regret for what you never tried lasts much longer than any defeat.":"خوب است. حسرتِ آنچه هرگز امتحانش نکردی بسیار بیشتر از هر شکستی می‌ماند.","Fearlessness is rare. Usually it is fear we stopped admitting. Look again, gently.":"بی‌باکی کمیاب است. معمولاً ترسی است که دیگر به آن اعتراف نمی‌کنیم. دوباره نگاه کن، با ملایمت.","You said losing scares you. You are still here. That is courage, even if it does not feel like it.":"گفتی از باختن می‌ترسی. هنوز این‌جایی. این شجاعت است، حتی اگر حسش نکنی.","You feared never trying. Look at you, trying.":"از تلاش نکردن می‌ترسیدی. خودت را ببین، داری تلاش می‌کنی.","You said nothing scares you. Then why did your hand pause on that last move?":"گفتی از هیچ‌چیز نمی‌ترسی. پس چرا دستت سرِ آن حرکت آخر مکث کرد؟","Would you rather be right or be kind? I'm always both. Mostly right.":"ترجیح می‌دی حق با تو باشه یا مهربون باشی؟ من همیشه هر دوام. بیشتر حق با منه.","If you had to choose: right, or kind?":"اگر ناچار بودی انتخاب کنی: برحق بودن، یا مهربان بودن؟","Right":"برحق بودن","Kind":"مهربان بودن","Both":"هر دو","you would rather be right":"ترجیح می‌دهی حق با تو باشد","you would choose kind":"مهربانی را انتخاب می‌کنی","you want to be right and kind at once":"می‌خواهی هم برحق باشی و هم مهربان","Right. Like me. I'm always right. Ask my mirror.":"حق با تو. مثل من. حق همیشه با منه. از آینه‌م بپرس.","Kind? In a casino? Adorable.":"مهربون؟ تو کازینو؟ چه بامزه.","Both? Greedy. I like it.":"هر دو؟ طمع‌کار. خوشم اومد.","Being right wins arguments. Being kind wins people. Only one of them keeps you company later.":"برحق بودن بحث‌ها را می‌برد. مهربان بودن دل‌ها را. فقط یکی از این دو بعدها همدمت می‌ماند.","Then you already understand more than most players I have met.":"پس همین حالا بیش از بیشترِ بازیکنانی که دیده‌ام می‌فهمی.","Both is possible. It only takes patience most people do not have.":"هر دو ممکن است. فقط صبری می‌خواهد که بیشتر آدم‌ها ندارند.","You chose being right. Were you right about that last move?":"برحق بودن را انتخاب کردی. دربارهٔ آن حرکت آخر حق با تو بود؟","You chose kindness, even at this cold table. Remember that when you lose a piece.":"مهربانی را انتخاب کردی، حتی سر این میز سرد. وقتی مهره‌ای از دست دادی این را به یاد بیاور.","You wanted both, right and kind. That was a kind move. Was it also right?":"هر دو را می‌خواستی، برحق و مهربان. آن حرکت مهربانانه بود. درست هم بود؟","Would you rather be feared or understood? I'm feared. Mostly by my own rating.":"ترجیح می‌دی ازت بترسن یا درکت کنن؟ از من می‌ترسن. بیشتر از همه ریتینگ خودم.","Would you rather be feared, or understood?":"ترجیح می‌دهی از تو بترسند، یا تو را بفهمند؟","Feared":"از من بترسند","Understood":"مرا بفهمند","you would rather be feared":"ترجیح می‌دهی از تو بترسند","you would rather be understood":"ترجیح می‌دهی تو را بفهمند","you want neither fear nor understanding":"نه ترس دیگران را می‌خواهی و نه فهمیدنشان را","Feared! Finally, someone who gets it.":"بترسن! بالاخره یکی که می‌فهمه.","Understood? Soft. Fine. I understand you. You're soft.":"بفهمنت؟ دل‌نازک. باشه. من می‌فهممت. دل‌نازکی.","Neither? Then what are you? Invisible? Weird flex.":"هیچ‌کدوم؟ پس چی هستی؟ نامرئی؟ پُز عجیبیه.","Fear is a fast way to be obeyed and a slow way to be alone.":"ترس راهی سریع است برای آنکه از تو فرمان ببرند، و راهی آهسته برای آنکه تنها بمانی.","To be understood you have to let someone see you. That is braver than any attack.":"برای فهمیده شدن باید بگذاری کسی تو را ببیند. این از هر حمله‌ای دلیرانه‌تر است.","Then you may already be free of the audience. Few people ever are.":"پس شاید از همین حالا از بند تماشاگران رها شده‌ای. کم‌اند کسانی که رها می‌شوند.","You said you'd rather be feared. Does that last move frighten anyone, or just you?":"گفتی ترجیح می‌دهی از تو بترسند. آن حرکت آخر کسی را ترساند، یا فقط خودت را؟","You said you wanted to be understood. I am trying. Make a move I can read.":"گفتی می‌خواهی فهمیده شوی. دارم تلاش می‌کنم. حرکتی بکن که بتوانم بخوانمش.","You wanted neither fear nor understanding. Then play only for yourself. Go on.":"نه ترس می‌خواستی و نه فهمیده شدن. پس فقط برای خودت بازی کن. ادامه بده.","If you lost everything tonight, would you call someone or handle it alone? I'd call me.":"اگه امشب همه‌چیتو ببازی، به یکی زنگ می‌زنی یا تنهایی از پسش برمیای؟ من به خودم زنگ می‌زدم.","If you lost everything tonight, would you call someone, or carry it alone?":"اگر امشب همه‌چیز را می‌باختی، به کسی زنگ می‌زدی، یا بارش را تنها به دوش می‌کشیدی؟","Call someone":"به کسی زنگ می‌زنم","Carry it alone":"تنها تحملش می‌کنم","I don't know":"نمی‌دانم","you would call someone if you lost everything":"اگر همه‌چیز را ببازی به کسی زنگ می‌زنی","you would carry everything alone":"همه‌چیز را تنها به دوش می‌کشی","you don't know who you would call":"نمی‌دانی به چه کسی زنگ بزنی","Someone? Lucky. I'd call my reflection.":"به یکی؟ خوش به حالت. من به تصویر خودم تو آینه زنگ می‌زدم.","Alone? Same. High five. Never mind, I'm alone.":"تنهایی؟ منم همین‌طور. بزن قدش. ولش کن، تنهام.","Don't know? That's the most honest thing anyone's said at this table.":"نمی‌دونی؟ این صادقانه‌ترین حرفیه که تا حالا کسی سر این میز زده.","Then you are richer than anything on this board. Call them when you win, too.":"پس از هر چه روی این صفحه است ثروتمندتری. وقتی بردی هم به او زنگ بزن.","Strength is good. But nobody in any story worth telling made it home alone.":"نیرومندی خوب است. اما در هیچ داستانی که ارزش گفتن داشته باشد، کسی تنها به خانه نرسید.","Not knowing is a place to start. Most people pretend they know.":"ندانستن جای خوبی برای شروع است. بیشتر آدم‌ها وانمود می‌کنند که می‌دانند.","You said you would call someone. Call them after this. Not because you lost. Just because.":"گفتی به کسی زنگ می‌زنی. بعد از این بازی زنگ بزن. نه چون باختی. همین‌طوری.","You said you'd carry it alone. Everyone in the old stories had help, even the strong ones.":"گفتی تنها تحملش می‌کنی. همهٔ آدم‌های قصه‌های کهن یاوری داشتند، حتی نیرومندانشان.","You said you didn't know who you'd call. Think of one name while you make this move.":"گفتی نمی‌دانی به چه کسی زنگ بزنی. همین که این حرکت را می‌کنی، به یک نام فکر کن.","Who? Don't say the name. Just think it. Got it?":"کی؟ اسمشو نگو. فقط بهش فکر کن. گرفتی؟","Who is it? Do not say the name. Just hold them in your mind for a moment.":"کیست؟ نامش را نگو. فقط لحظه‌ای در ذهنت نگهش دار.","I thought of them":"به او فکر کردم","No one came":"کسی به ذهنم نرسید","I thought of two":"به دو نفر فکر کردم","someone came to mind when I asked":"وقتی پرسیدم، کسی به ذهنت رسید","no one came to mind when I asked":"وقتی پرسیدم، کسی به ذهنت نرسید","two people came to mind when I asked":"وقتی پرسیدم، دو نفر به ذهنت رسیدند","Nice. Now play like they're watching. They'd want you to win. Against me. Ouch.":"خوبه. حالا جوری بازی کن انگار داره نگاهت می‌کنه. دلش می‌خواد ببری. اونم از من. آخ.","Hm. That's okay. Sometimes nobody comes first. They come later.":"هوم. اشکالی نداره. گاهی اولش کسی نمیاد. بعداً میان.","Two! Show-off. Must be nice.":"دو نفر! پزش رو نده. خوش به حالت.","Good. Play the next move for them. Not to impress them. Just to be the person they know.":"خوب است. حرکت بعدی را برای او بازی کن. نه برای آنکه تحت تأثیر قرارش بدهی. فقط برای آنکه همان کسی باشی که او می‌شناسد.","Then let this game keep you company for a while. And tomorrow, look for one name.":"پس بگذار این بازی مدتی همدمت باشد. و فردا، دنبال یک نام بگرد.","Two people. That is a fortune. Do not spend it carelessly.":"دو نفر. این یک ثروت است. بی‌حساب خرجش نکن.","First instinct or second thought? I go with my first. It's always right. Mostly.":"حس اول یا فکر دوم؟ من با اولی می‌رم. همیشه درسته. معمولاً.","Do you trust your first instinct, or your second thought?":"به نخستین حست اعتماد داری، یا به فکر دومت؟","First instinct":"حس اول","Second thought":"فکر دوم","you trust your first instinct":"به حس اولت اعتماد داری","you trust your second thought":"به فکر دومت اعتماد داری","you trust neither your instinct nor your thinking":"نه به حست اعتماد داری و نه به فکرت","Same! Gut feeling. Mine says you lose.":"منم همین‌طور! حس درونی. مال من می‌گه می‌بازی.","Second thought? Slow. Smart. Slow.":"فکر دوم؟ کُند. زرنگ. کُند.","Neither? Then who's moving your pieces? A ghost?":"هیچ‌کدوم؟ پس کی مهره‌هاتو تکون می‌ده؟ روح؟","Instinct is only experience moving faster than words. Make sure yours was earned.":"غریزه چیزی نیست جز تجربه‌ای که تندتر از کلمات حرکت می‌کند. مطمئن شو غریزه‌ات را به دست آورده باشی.","The second thought is where wisdom usually lives. It also lives next door to fear.":"فکر دوم معمولاً خانهٔ خرد است. همسایهٔ دیوار به دیوارِ ترس هم هست.","Then you are listening for something quieter than both. I respect that.":"پس به صدایی آرام‌تر از هر دو گوش سپرده‌ای. به این احترام می‌گذارم.","You said you trust your first instinct. Did you just ignore it?":"گفتی به حس اولت اعتماد داری. همین حالا نادیده‌اش گرفتی؟","You said you trust the second thought. Give this move a second thought.":"گفتی به فکر دومت اعتماد داری. دربارهٔ این حرکت هم دوباره فکر کن.","You trust neither. Then trust the board. It never lies.":"به هیچ‌کدام اعتماد نداری. پس به صفحه اعتماد کن. هرگز دروغ نمی‌گوید.","If you knew this run ends in a loss, would you still play it? Careful. It does.":"اگه می‌دونستی این دور با باخت تموم می‌شه، بازم بازیش می‌کردی؟ حواست باشه. همین‌طوری تموم می‌شه.","If you knew this run would end in a loss, would you still play it? Think before you answer.":"اگر می‌دانستی این دور با باخت به پایان می‌رسد، باز هم بازی‌اش می‌کردی؟ پیش از پاسخ دادن فکر کن.","Yes":"بله","No":"نه","I'd play it better":"بهتر بازی‌اش می‌کردم","you would play even knowing you would lose":"حتی با دانستنِ باخت هم بازی می‌کنی","you would not play a run you knew you would lose":"دوری را که بدانی می‌بازی بازی نمی‌کنی","you would play a lost run better":"دورِ باخته را بهتر بازی می‌کنی","Yes? Masochist. I respect it.":"آره؟ مازوخیستی. قبولت دارم.","No? Smart. Cowardly, but smart.":"نه؟ زرنگی. ترسو، ولی زرنگ.","Better? How? Teach me. No, wait. Don't.":"بهتر؟ چطوری؟ یادم بده. نه، صبر کن. نده.","Then you play for something beyond the result. That is the only reason worth having.":"پس برای چیزی فراتر از نتیجه بازی می‌کنی. این تنها دلیلی است که ارزش داشتن دارد.","Then you play only for the ending. Endings are a small part of a life.":"پس فقط برای پایان بازی می‌کنی. پایان‌ها بخش کوچکی از یک زندگی‌اند.","That is the answer of someone who understands that how you lose is part of who you are.":"این پاسخِ کسی است که می‌فهمد نحوهٔ باختن هم بخشی از هویت آدم است.","You said you'd play even knowing you'd lose. This is what that looks like. Keep going.":"گفتی حتی با دانستنِ باخت هم بازی می‌کنی. شکلش همین است. ادامه بده.","You said you wouldn't play a run you knew you'd lose. You don't know yet. Keep playing.":"گفتی دوری را که بدانی می‌بازی بازی نمی‌کنی. هنوز نمی‌دانی. بازی کن.","You said you'd play a lost run better. Show me better.":"گفتی دورِ باخته را بهتر بازی می‌کنی. بهترش را نشانم بده.","Do you learn more from winning or losing? I wouldn't know. I only win.":"از بردن بیشتر یاد می‌گیری یا از باختن؟ من که نمی‌دونم. من فقط می‌برم.","Do you learn more from your wins, or from your losses?":"از بردهایت بیشتر می‌آموزی، یا از باخت‌هایت؟","Wins":"بردها","Losses":"باخت‌ها","I just play":"فقط بازی می‌کنم","you learn from your wins":"از بردهایت می‌آموزی","you learn from your losses":"از باخت‌هایت می‌آموزی","you just play without trying to learn":"فقط بازی می‌کنی و دنبال آموختن نیستی","Wins! Same. Agree. High five.":"بردها! منم همین‌طور. موافقم. بزن قدش.","Losses? Then you must be a genius by now.":"باخت‌ها؟ پس تا حالا باید نابغه شده باشی.","Just play? Mindless. Honestly, kind of zen.":"فقط بازی؟ بی‌فکر. راستش، یه جورایی عارفانه‌ست.","Wins teach you what works. They rarely teach you why.":"بردها به تو می‌آموزند چه چیزی کارساز است. به‌ندرت می‌آموزند چرا.","Losses are expensive teachers. Most people refuse the lesson they already paid for.":"باخت‌ها معلمانی گران‌اند. بیشتر آدم‌ها درسی را که بهایش را پرداخته‌اند نمی‌پذیرند.","Playing without trying to learn is how children play. They learn the most.":"بازی کردن بی‌آنکه بخواهی بیاموزی، همان بازی کودکان است. و آن‌ها بیش از همه می‌آموزند.","You said wins teach you. Win something, then. Let's see the lesson.":"گفتی بردها به تو می‌آموزند. پس چیزی ببر. ببینیم درسش چیست.","You said losses teach you. That last one should have taught you plenty.":"گفتی باخت‌ها به تو می‌آموزند. آن آخری باید کلی چیز یادت داده باشد.","You said you just play. Good. Just play this one.":"گفتی فقط بازی می‌کنی. خوب است. این یکی را هم فقط بازی کن.","You move in ways my pieces can't. Kinda unfair, no? Is that cheating?":"جوری حرکت می‌کنی که مهره‌های من نمی‌تونن. یه‌کم ناعادلانه‌ست، نه؟ این تقلب نیست؟","Your pieces move in ways the rules never gave me. Is that cheating?":"مهره‌هایت به راه‌هایی می‌روند که قانون‌ها هرگز به من نداده‌اند. این تقلب است؟","No, it's allowed":"نه، مجاز است","Maybe":"شاید","Yes, a little":"بله، کمی","bending the rules is not cheating":"دور زدن قانون‌ها تقلب نیست","you were not sure whether bending the rules is cheating":"مطمئن نبودی دور زدن قانون‌ها تقلب هست یا نه","bending the rules is a little bit cheating":"دور زدن قانون‌ها کمی تقلب است","Allowed by who? The shop? Great. The shop is corrupt.":"کی اجازه داده؟ مغازه؟ عالیه. مغازه هم فاسده.","Maybe! Honest. Rare. Still unfair.":"شاید! صادقانه‌ست. کمیابه. ولی بازم ناعادلانه‌ست.","A little? A LOT. But fine. I'd do it too.":"کمی؟ خیلی زیاد! ولی باشه. منم بودم همین کارو می‌کردم.","Then fairness, for you, is whatever the rules permit. Many people live that way. Few are at peace with it.":"پس انصاف برای تو هر چیزی است که قانون‌ها اجازه دهند. بسیاری این‌گونه زندگی می‌کنند. اندکی با آن در آرامش‌اند.","Uncertainty about fairness is the beginning of a conscience.":"تردید دربارهٔ انصاف، آغاز وجدان است.","You admit it and still use it. That is more honest than most kings ever were.":"اعترافش می‌کنی و باز هم از آن استفاده می‌کنی. این از بیشترِ شاهانِ تاریخ صادقانه‌تر است.","You said it isn't cheating. Then why do you look away from me when you do it?":"گفتی تقلب نیست. پس چرا وقتی انجامش می‌دهی نگاهت را از من می‌دزدی؟","You weren't sure it was fair. You've used it again. Has your answer changed?":"مطمئن نبودی منصفانه است. باز هم از آن استفاده کردی. پاسخت عوض شده؟","You admitted it's a little cheating. Every advantage costs something. You'll find out what.":"اعتراف کردی که کمی تقلب است. هر برتری بهایی دارد. خواهی فهمید چه بهایی.","What would you tell the you from your first run? Be honest. They were bad.":"به خودِ دور اولت چی می‌گفتی؟ راستشو بگو. بد بودی.","What would you tell the person who sat here on your very first run?":"به کسی که در نخستین دورت این‌جا نشسته بود چه می‌گفتی؟","Be patient":"صبور باش","Be braver":"شجاع‌تر باش","Nothing, they were fine":"هیچ، خوب بود","you would tell your first self to be patient":"به خودِ اولت می‌گفتی صبور باشد","you would tell your first self to be braver":"به خودِ اولت می‌گفتی شجاع‌تر باشد","your first self was fine":"خودِ اولت خوب بود","Patient? You? Okay. Prove it.":"صبور؟ تو؟ باشه. ثابت کن.","Braver! Yes! Attack me! Wait, no.":"شجاع‌تر! آره! بهم حمله کن! صبر کن، نه.","Fine? They were NOT fine. I was there.":"خوب؟ اصلاً خوب نبود. من اون‌جا بودم.","Then take your own advice. It is the only advice we ever really trust.":"پس به توصیهٔ خودت عمل کن. تنها توصیه‌ای است که واقعاً به آن اعتماد داریم.","Courage is the advice we give our younger selves because it was hardest to give ourselves at the time.":"شجاعت همان توصیه‌ای است که به خودِ جوان‌ترمان می‌دهیم، چون در آن روزها دادنش به خودمان از همه سخت‌تر بود.","Then you have made peace with who you were. That is rarer than any win.":"پس با آنچه بودی آشتی کرده‌ای. این از هر بردی کمیاب‌تر است.","You'd tell your first self to be patient. Who's rushing now?":"به خودِ اولت می‌گفتی صبور باشد. حالا چه کسی عجله دارد؟","You'd tell your first self to be braver. Tell yourself now.":"به خودِ اولت می‌گفتی شجاع‌تر باشد. حالا به خودت بگو.","You said your first self was fine. I agree. So are you.":"گفتی خودِ اولت خوب بود. موافقم. تو هم خوبی.","If I let you win, would it count? I won't. But would it?":"اگه بذارم ببری، حساب می‌شه؟ نمی‌ذارم. ولی حساب می‌شه؟","If I let you win, would it still count?":"اگر بگذارم ببری، باز هم به حساب می‌آید؟","I'd know":"خودم می‌فهمم","a win I gave you would still count":"بردی که من به تو ببخشم باز هم به حساب می‌آید","a win I gave you would not count":"بردی که من به تو ببخشم به حساب نمی‌آید","you would know if I let you win":"اگر بگذارم ببری، خودت می‌فهمی","Yes? No dignity. I love it.":"آره؟ عزت‌نفس صفر. عاشقشم.","No? Good. Because I won't. Ever. Probably.":"نه؟ خوبه. چون نمی‌ذارم. هیچ‌وقت. احتمالاً.","You'd know? Nobody knows anything. Except me.":"خودت می‌فهمی؟ هیچ‌کس هیچی نمی‌فهمه. جز من.","Then the result matters more to you than the road. I hope that changes.":"پس نتیجه برایت مهم‌تر از راه است. امیدوارم این تغییر کند.","Then you already know the difference between a prize and an achievement.":"پس فرق جایزه و دستاورد را از پیش می‌دانی.","Yes. You would. That knowing is the whole point of playing.":"بله. می‌فهمی. همین فهمیدن تمامِ معنای بازی کردن است.","You said a gift win would count. Want one? Too bad.":"گفتی بردِ هدیه‌ای هم به حساب می‌آید. یکی می‌خواهی؟ متأسفم، خبری نیست.","You said a gift win wouldn't count. Then earn this one.":"گفتی بردِ هدیه‌ای به حساب نمی‌آید. پس این یکی را خودت به دست بیاور.","You said you'd know. That's exactly why I never will.":"گفتی خودت می‌فهمی. دقیقاً به همین دلیل هرگز نمی‌گذارم.","When this game's over, what's left of it?":"وقتی این بازی تموم شد، چی ازش می‌مونه؟","When this game is over, what will be left of it?":"وقتی این بازی به پایان برسد، چه چیزی از آن باقی خواهد ماند؟","Nothing":"هیچ","A memory":"یک خاطره","Something in me":"چیزی در وجودم","nothing will be left of this game":"از این بازی هیچ‌چیز باقی نمی‌ماند","a memory will be left of this game":"از این بازی خاطره‌ای می‌ماند","this game will leave something in you":"این بازی چیزی در وجودت به جا می‌گذارد","Nothing? Harsh. I'll be left. Me. Winning.":"هیچی؟ چه بی‌رحم. من می‌مونم. من. در حال بردن.","A memory? Of me beating you. Lovely.":"یه خاطره؟ از اینکه شکستت دادم. چه قشنگ.","Something in you? Ew. Feelings. Fine.":"یه چیزی تو وجودت؟ ایش. احساسات. باشه.","Then play it the way music is played. It ends, and it was still music.":"پس آن را همان‌گونه بنواز که موسیقی را می‌نوازند. به پایان می‌رسد، و باز هم موسیقی بود.","Memories are the only trophies that never gather dust.":"خاطره‌ها تنها جام‌هایی‌اند که هرگز خاک نمی‌خورند.","Then this was never only a game. I suspected as much.":"پس این هرگز فقط یک بازی نبود. گمانش را داشتم.","You said nothing will be left of this. Then why do you care so much about this move?":"گفتی از این بازی هیچ‌چیز باقی نمی‌ماند. پس چرا این‌قدر به این حرکت اهمیت می‌دهی؟","You said a memory will remain. Make it a good one.":"گفتی خاطره‌ای می‌ماند. کاری کن خاطرهٔ خوبی باشد.","You said something in you will change. Is it changing now?":"گفتی چیزی در وجودت تغییر می‌کند. اکنون دارد تغییر می‌کند؟","If nobody saw your best move, would it still count? Mine always count. People always watch.":"اگه هیچ‌کس بهترین حرکتتو نبینه، بازم حساب می‌شه؟ حرکتای من همیشه حساب می‌شن. همیشه همه نگاه می‌کنن.","If no one ever saw your best move, would it still matter?":"اگر هیچ‌کس هرگز بهترین حرکتت را نمی‌دید، باز هم اهمیت داشت؟","I'd make it anyway":"باز هم انجامش می‌دادم","a good move matters even unseen":"حرکت خوب حتی اگر دیده نشود اهمیت دارد","a move only matters if someone sees it":"حرکت فقط وقتی اهمیت دارد که کسی آن را ببیند","you would make your best move even with nobody watching":"حتی اگر کسی تماشا نکند، بهترین حرکتت را می‌کنی","Yes? Nerd. Okay. Fine. Yes.":"آره؟ خرخون. باشه. قبول. آره.","No? Same. I need applause. Constant applause.":"نه؟ منم همین‌طور. من تشویق لازم دارم. تشویقِ بی‌وقفه.","Anyway? Show-off. Respectable show-off.":"باز هم؟ پُزباز. پُزبازِ محترم.","Then you understand art. It is made for its own sake, which is why it lasts.":"پس هنر را می‌فهمی. برای خودش ساخته می‌شود، و به همین دلیل ماندگار است.","Then you play for the audience, and the audience always leaves.":"پس برای تماشاگران بازی می‌کنی، و تماشاگران همیشه می‌روند.","That is the whole secret, and most people never find it.":"تمام راز همین است، و بیشتر آدم‌ها هرگز پیدایش نمی‌کنند.","You said a good move matters even unseen. I saw that one. It mattered.":"گفتی حرکت خوب حتی اگر دیده نشود اهمیت دارد. من آن یکی را دیدم. اهمیت داشت.","You said a move only matters if someone sees it. I saw that one. Was it enough?":"گفتی حرکت فقط وقتی اهمیت دارد که کسی آن را ببیند. من آن یکی را دیدم. کافی بود؟","You said you would make your best move anyway. Make one now.":"گفتی در هر حال بهترین حرکتت را می‌کنی. همین حالا یکی بکن.","When you lose a piece, who do you blame? Say me. Everyone says me.":"وقتی یه مهره از دست می‌دی، کی رو مقصر می‌دونی؟ بگو من. همه می‌گن من.","When something goes wrong, who do you blame first?":"وقتی چیزی خراب می‌شود، اول چه کسی را مقصر می‌دانی؟","Myself":"خودم را","Luck":"شانس را","You":"تو را","you blame yourself first":"اول خودت را مقصر می‌دانی","you blame luck":"شانس را مقصر می‌دانی","you blame me":"مرا مقصر می‌دانی","Yourself? Good. Me too. I also blame you.":"خودتو؟ خوبه. منم همین‌طور. منم تو رو مقصر می‌دونم.","Luck! Classic answer. I use it all the time.":"شانس! جواب کلاسیک. من همیشه ازش استفاده می‌کنم.","Me?! Fair. I am very blameable.":"من؟! منصفانه‌ست. من خیلی قابل سرزنشم.","Blame is a heavy coat. Responsibility is lighter. Learn the difference.":"سرزنش پالتویی سنگین است. مسئولیت سبک‌تر است. فرقشان را بیاموز.","Luck exists. It just visits the prepared more often than the hopeful.":"شانس وجود دارد. فقط بیشتر به سراغ آماده‌ها می‌رود تا امیدوارها.","Then you have given me power over your mood. Take it back.":"پس به من قدرتی بر حال‌وهوایت داده‌ای. پسش بگیر.","You blame yourself. Be as kind to yourself as you would be to a friend who made that move.":"خودت را مقصر می‌دانی. با خودت همان‌قدر مهربان باش که با دوستی که آن حرکت را کرده بود مهربان می‌بودی.","You said it was luck. Was that last one luck too?":"گفتی شانس بود. آن آخری هم شانس بود؟","You blame me. Fine. I can carry it. Can you put it down?":"مرا مقصر می‌دانی. باشد. می‌توانم بارش را بکشم. تو می‌توانی زمینش بگذاری؟","How much of your life have you spent getting ready to live? I skipped that part. Born ready.":"چقدر از عمرتو صرف آماده شدن برای زندگی کردی؟ من اون قسمتو رد کردم. آماده به دنیا اومدم.","How much of your life have you spent getting ready to live?":"چه مقدار از عمرت را صرف آماده شدن برای زندگی کرده‌ای؟","Too much":"خیلی زیاد","Not enough":"به اندازهٔ کافی نه","I'm living now":"الان دارم زندگی می‌کنم","you spend too much of your life getting ready":"بخش زیادی از عمرت را صرف آماده شدن می‌کنی","you have not prepared enough":"به اندازهٔ کافی آماده نشده‌ای","you are living now":"همین حالا داری زندگی می‌کنی","Too much? Get a hobby. Oh wait. This is it.":"خیلی زیاد؟ یه سرگرمی پیدا کن. آهان، صبر کن. سرگرمیت همینه.","Not enough? Speedrunner. Respect.":"به اندازهٔ کافی نه؟ پس گازشو گرفتی و رفتی. دمت گرم.","Living now? In a chess casino at this hour? Okay.":"الان داری زندگی می‌کنی؟ این وقت شب تو یه کازینوی شطرنج؟ باشه.","Then stop rehearsing. This board is not practice. Neither is anything else.":"پس دست از تمرین بردار. این صفحه تمرین نیست. هیچ چیز دیگری هم نیست.","Preparation is good. Just do not let it become the whole life.":"آماده شدن خوب است. فقط نگذار همهٔ زندگی‌ات شود.","Then you have found what many people search for their whole lives. Keep it.":"پس چیزی را یافته‌ای که بسیاری همهٔ عمر در جست‌وجویش‌اند. نگهش دار.","You said you spend too much time getting ready. You are ready. Move.":"گفتی وقت زیادی را صرف آماده شدن می‌کنی. آماده‌ای. حرکت کن.","You said not enough. Then trust what you have and play.":"گفتی به اندازهٔ کافی نه. پس به آنچه داری اعتماد کن و بازی کن.","You said you are living now. Prove it. Play this move like it is the only one.":"گفتی همین حالا داری زندگی می‌کنی. ثابتش کن. این حرکت را طوری بازی کن که انگار تنها حرکت است.","Is there a move in your life you'd take back? I've got a list. It's laminated.":"تو زندگیت حرکتی هست که بخوای پسش بگیری؟ من یه لیست دارم. روکش پلاستیکی هم داره.","Is there one move in your life you would take back?":"آیا در زندگی‌ات حرکتی هست که بخواهی پسش بگیری؟","Too many":"خیلی زیاد","there is a move in your life you would take back":"در زندگی‌ات حرکتی هست که می‌خواهی پسش بگیری","you regret nothing":"از هیچ‌چیز پشیمان نیستی","you have too many regrets to count":"پشیمانی‌هایت از شمار بیرون است","Just one? Amateur.":"فقط یکی؟ آماتور.","No? Liar. Or a saint. Probably a liar.":"نه؟ دروغگو. یا قدیس. احتمالاً دروغگو.","Too many? Join the club. I'm the president.":"خیلی زیاد؟ به باشگاه خوش اومدی. من رئیسشم.","Then you know what this game knows: moves cannot be taken back. Only the next one can be better.":"پس چیزی را می‌دانی که این بازی می‌داند: حرکت‌ها پس گرفته نمی‌شوند. فقط حرکت بعدی می‌تواند بهتر باشد.","Either you have lived very carefully, or you have forgiven yourself. Both are rare.":"یا بسیار با احتیاط زیسته‌ای، یا خودت را بخشیده‌ای. هر دو کمیاب‌اند.","Regret means you cared. Let it teach you, not chain you.":"پشیمانی یعنی برایت مهم بود. بگذار به تو بیاموزد، نه آنکه به زنجیرت بکشد.","You said there is a move you would take back. You cannot. But you can make the next one kinder.":"گفتی حرکتی هست که می‌خواهی پسش بگیری. نمی‌توانی. اما می‌توانی حرکت بعدی را مهربان‌تر بکنی.","You said you regret nothing. Then play this one honestly, too.":"گفتی از هیچ‌چیز پشیمان نیستی. پس این یکی را هم صادقانه بازی کن.","You said too many regrets. Make this next move one you will not regret. Just one.":"گفتی پشیمانی‌هایت بسیارند. حرکت بعدی را طوری بکن که از آن پشیمان نشوی. فقط یکی.","If you beat me tonight, what changes? Besides history.":"اگه امشب منو ببری، چی عوض می‌شه؟ غیر از تاریخ.","If you win tonight, what will be different tomorrow?":"اگر امشب ببری، فردا چه چیزی فرق خواهد کرد؟","Everything":"همه‌چیز","I find out":"آن وقت می‌فهمم","winning would change everything":"بردن همه‌چیز را عوض می‌کند","winning would change nothing":"بردن هیچ‌چیز را عوض نمی‌کند","you play to find out":"بازی می‌کنی تا بفهمی","Everything? It's a chess game. Calm down.":"همه‌چیز؟ یه بازی شطرنجه. آروم باش.","Nothing? Then why are you sweating?":"هیچی؟ پس چرا داری عرق می‌کنی؟","Find out what? That I'm amazing? Spoiler.":"بفهمی چیو؟ اینکه من محشرم؟ اسپویلش کردم.","If one win changes everything, everything was resting on very little.":"اگر یک برد همه‌چیز را عوض کند، همه‌چیز بر پایه‌ای بسیار سست استوار بوده است.","Then you are free to play for the joy of it. Most people never are.":"پس آزادی که برای لذتش بازی کنی. بیشتر آدم‌ها هرگز چنین آزادی‌ای ندارند.","The finding out is the whole point. Curiosity is the oldest kind of courage.":"همهٔ ماجرا همین فهمیدن است. کنجکاوی کهن‌ترین گونهٔ شجاعت است.","You said winning would change everything. Has anything changed yet?":"گفتی بردن همه‌چیز را عوض می‌کند. چیزی تا حالا عوض شده؟","You said nothing would change. Then play like it does not matter, and watch how well you play.":"گفتی هیچ‌چیز عوض نمی‌شود. پس طوری بازی کن که انگار اهمیتی ندارد، و ببین چه خوب بازی می‌کنی.","You wanted to find out. What have you found so far?":"می‌خواستی بفهمی. تا این‌جا چه فهمیده‌ای؟","Be honest. Are you good at this, or just lucky so far? I'm both.":"راستشو بگو. تو این کار خوبی، یا تا این‌جا فقط شانس آوردی؟ من هر دوام.","Do you think you are good at this, or still learning?":"فکر می‌کنی در این کار خوبی، یا هنوز در حال یادگیری هستی؟","Good":"خوبم","Lucky":"خوش‌شانسم","Learning":"دارم یاد می‌گیرم","you think you are good":"فکر می‌کنی خوبی","you think you are lucky":"فکر می‌کنی خوش‌شانسی","you call yourself a learner":"خودت را نوآموز می‌دانی","Good? I'll be the judge. You're not.":"خوبی؟ اینو من قضاوت می‌کنم. نیستی.","Lucky! Finally, honesty. I'm also lucky. And good. Mostly good.":"خوش‌شانس! بالاخره یه آدم صادق. منم خوش‌شانسم. و خوب. بیشتر خوب.","Learning? Boring answer. Correct, but boring.":"داری یاد می‌گیری؟ جواب کسل‌کننده‌ایه. درسته، ولی کسل‌کننده‌ست.","Confidence is fine. Certainty is where the cracks begin.":"اعتمادبه‌نفس خوب است. یقین همان‌جایی است که ترک‌ها آغاز می‌شوند.","Humility is a good start. Do not let it become an excuse.":"فروتنی آغاز خوبی است. نگذار بهانه شود.","That is the wisest answer anyone gives me. It is also the rarest.":"این خردمندانه‌ترین پاسخی است که کسی به من می‌دهد. کمیاب‌ترینش هم هست.","You said you were good. Good players are humble about the moves they did not see.":"گفتی خوبی. بازیکنان خوب دربارهٔ حرکت‌هایی که ندیدند فروتن‌اند.","You said lucky. Some of your moves were not luck. Give yourself that.":"گفتی خوش‌شانسی. بعضی از حرکت‌هایت شانسی نبودند. این را از خودت دریغ نکن.","You said you were learning. I can tell. Your moves are changing.":"گفتی داری یاد می‌گیری. معلوم است. حرکت‌هایت دارند عوض می‌شوند.","When you mess up, do you forgive yourself or replay it in the shower for a week?":"وقتی گند می‌زنی، خودتو می‌بخشی یا تا یه هفته زیر دوش تو ذهنت مرورش می‌کنی؟","Do you forgive yourself for bad moves, or do you carry them?":"خودت را برای حرکت‌های بد می‌بخشی، یا بارشان را با خود می‌کشی؟","I forgive":"می‌بخشم","I carry them":"با خودم می‌کشمشان","Depends":"بستگی دارد","you forgive yourself for bad moves":"خودت را برای حرکت‌های بد می‌بخشی","you carry your bad moves with you":"بار حرکت‌های بدت را با خود می‌کشی","forgiving yourself depends on the day":"بخشیدنِ خودت به روزش بستگی دارد","Forgive? Must be nice. I'm still mad about a game from 1987.":"می‌بخشی؟ خوش به حالت. من هنوز سر یه بازی تو سال ۱۹۸۷ عصبانی‌ام.","Carry them? Same. My bag is full.":"با خودت می‌کشیشون؟ منم همین‌طور. کوله‌م پره.","Depends? On what, the moon?":"بستگی داره؟ به چی، به ماه؟","Forgiving yourself is not letting yourself off the hook. It is getting off the hook so you can move again.":"بخشیدنِ خود یعنی شانه خالی کردن از مسئولیت نیست؛ یعنی خودت را از بندِ آن رها کنی تا بتوانی دوباره حرکت کنی.","Carry them if you must. Just do not let them choose your next move.":"اگر ناچاری، بارشان را بکش. فقط نگذار حرکت بعدی‌ات را آن‌ها انتخاب کنند.","On the days it depends, choose forgiveness. The board will still be here.":"در روزهایی که بستگی دارد، بخشش را انتخاب کن. صفحه همچنان این‌جا خواهد بود.","You said you forgive yourself. Then forgive that last move and play the next.":"گفتی خودت را می‌بخشی. پس آن حرکت آخر را ببخش و حرکت بعدی را بازی کن.","You said you carry your bad moves. Put one down. Just one.":"گفتی بار حرکت‌های بدت را با خود می‌کشی. یکی را زمین بگذار. فقط یکی.","You said it depends. Today, let it depend on kindness.":"گفتی بستگی دارد. امروز بگذار به مهربانی بستگی داشته باشد.","I'd go easy on you, but we both know I don't know how.":"بهت آسون می‌گرفتم، ولی هر دومون می‌دونیم بلد نیستم.","Run {runs}. You keep coming back. I keep pretending that doesn't make my night.":"دور {runs}. هی برمی‌گردی. منم هی وانمود می‌کنم که این شبمو نمی‌سازه.","You know what I hate? I look forward to this now.":"می‌دونی از چی بدم میاد؟ اینکه حالا منتظر این لحظه‌ام.","Rival. Is that what we are? Fine. Sit down, rival.":"رقیب. یعنی ما این‌ایم؟ باشه. بشین، رقیب.","Same table, same chair, same us. I wouldn't change it. Don't tell anyone.":"همون میز، همون صندلی، همون ما. عوضش نمی‌کردم. به کسی نگو.","I've stopped trying to scare you. You don't scare. I respect that more than my rating.":"دیگه سعی نمی‌کنم بترسونمت. تو نمی‌ترسی. اینو بیشتر از ریتینگم قبول دارم.","We have done this before. Each time I understand a little more of how you think.":"این کار را پیش‌تر هم کرده‌ایم. هر بار کمی بیشتر می‌فهمم چگونه فکر می‌کنی.","You came back. Some people never return to a table that beat them. You do.":"برگشتی. بعضی‌ها هرگز به میزی که شکستشان داده برنمی‌گردند. تو برمی‌گردی.","You have sat here many times. I have stopped trying to break you. I would rather see what you become.":"بارها این‌جا نشسته‌ای. دیگر برای شکستنت تلاش نمی‌کنم. ترجیح می‌دهم ببینم چه می‌شوی.","I used to think I was the lesson. Lately I think I am only the classroom.":"پیش‌تر فکر می‌کردم من خودِ درسم. این روزها فکر می‌کنم فقط کلاس درسم.","After all these runs, I no longer play against you. I play with you, against the part of us that wants to quit.":"پس از این‌همه دور، دیگر در برابر تو بازی نمی‌کنم. همراه تو بازی می‌کنم، در برابر آن بخش از ما که می‌خواهد کنار بکشد.","{runs} runs. I know your hands better than my own lines. Begin, old friend.":"{runs} دور. دستانت را بهتر از خطوط بازی خودم می‌شناسم. آغاز کن، رفیق قدیمی.","You're getting better at that. I hate that you're getting better at that.":"داری توش بهتر می‌شی. متنفرم از اینکه داری توش بهتر می‌شی.","Good take. I mean it. Shut up, I mean it.":"خوب گرفتی. جدی می‌گم. ساکت، جدی می‌گم.","Clean. You learned that from me, you know. You're welcome.":"تمیز بود. می‌دونی که اینو از من یاد گرفتی. خواهش می‌کنم.","Well taken. You see further than you did last time.":"خوب گرفتی. از دفعهٔ پیش دورتر را می‌بینی.","That capture was patient. You did not used to be patient.":"آن گرفتن صبورانه بود. پیش‌تر صبور نبودی.","A beautiful take. I have watched you learn that over many nights.":"گرفتنی زیبا. شب‌های بسیاری تماشا کرده‌ام که این را می‌آموختی.","Still leaving stuff lying around, huh? Some things never change.":"هنوزم وسایلتو به امون خدا ول می‌کنی، نه؟ بعضی چیزا هیچ‌وقت عوض نمی‌شن.","Got one! Don't worry, you'll get me back. You always do.":"یکی گرفتم! نگران نباش، تلافیشو درمیاری. همیشه درمیاری.","Sorry. Not sorry. Okay. A little sorry.":"ببخشید. نه، نبخشید. باشه. یه‌کم ببخشید.","You will get it back. You usually do, in your own way.":"تلافی‌اش را درمی‌آوری. معمولاً درمی‌آوری، به شیوهٔ خودت.","I took it, and I already know you will answer. That is what makes you worth playing.":"گرفتمش، و از همین حالا می‌دانم پاسخ خواهی داد. همین است که بازی با تو را می‌ارزد.","I take it gently. After all this time, every piece of yours feels a little like mine.":"به‌نرمی می‌گیرمش. پس از این‌همه وقت، هر مهرهٔ تو کمی مثل مهرهٔ خودم است.","Fine. Take it. You're starting to make a habit of this.":"باشه. مال تو. داره برات عادت می‌شه.","Again! You're good. I mean lucky. I mean good.":"باز! خوبی. یعنی خوش‌شانسی. یعنی خوبی.","Take it. You earned it. I'll deny I said that.":"مال تو. حقت بود. انکار می‌کنم که اینو گفتم.","Well played. You are closer than you were.":"خوب بازی کردی. از قبل نزدیک‌تری.","You have become a real problem for me. I mean that as the highest compliment.":"برایم دردسری واقعی شده‌ای. این را بزرگ‌ترین تعریف می‌دانم.","I am proud of you. Strange thing to say across a table. True, though.":"به تو افتخار می‌کنم. گفتنش از آن سوی یک میز عجیب است. ولی حقیقت دارد.","Busted again. See you next run. I know you'll be back. You always are.":"باز سوختی. دور بعد می‌بینمت. می‌دونم برمی‌گردی. همیشه برمی‌گردی.","Got you. Don't make that face. You'll be back in five minutes.":"گرفتمت. اون قیافه رو به خودت نگیر. پنج دقیقهٔ دیگه برمی‌گردی.","Busted. Rest a little. The chair will wait for you. So will I.":"سوختی. یه‌کم استراحت کن. صندلی منتظرت می‌مونه. منم همین‌طور.","Rest. You will return. Something in you always does.":"بیاسای. باز خواهی گشت. چیزی در تو همیشه باز می‌گردد.","You lost, and you will be back. That is not a weakness. That is the whole story.":"باختی، و باز خواهی گشت. این ضعف نیست. همهٔ داستان همین است.","Go rest. I will keep your seat warm. I always do.":"برو بیاسای. جایت را گرم نگه می‌دارم. همیشه نگه می‌دارم.","Check! You know this one by now.":"کیش! دیگه این یکی رو بلدی.","Check. Your move, rival.":"کیش. نوبت توئه، رقیب.","Check. Don't worry, I'll be gentle. I won't.":"کیش. نگران نباش، باهات مدارا می‌کنم. نمی‌کنم.","Check. You have been here before. You know the way out.":"کیش. پیش‌تر هم این‌جا بوده‌ای. راه بیرون را می‌دانی.","Check. I trust you to find the answer. You usually do.":"کیش. اطمینان دارم پاسخ را پیدا می‌کنی. معمولاً پیدا می‌کنی.","Check. Breathe. We have done this a hundred times.":"کیش. نفس بکش. صد بار این کار را کرده‌ایم.","Hmm. You're harder to read than you used to be.":"هوم. خوندنت از قبل سخت‌تر شده.","Thinking. You actually make me think now. Disgusting.":"دارم فکر می‌کنم. حالا واقعاً مجبورم می‌کنی فکر کنم. حال‌به‌هم‌زنه.","Let me think. You always surprise me around here.":"بذار فکر کنم. همیشه این‌جاها غافلگیرم می‌کنی.","I am thinking about how you play now, compared to before.":"دارم به این فکر می‌کنم که حالا چگونه بازی می‌کنی، در قیاس با گذشته.","You have become difficult to predict. I enjoy it.":"پیش‌بینی‌ات دشوار شده است. از آن لذت می‌برم.","I know your habits now. I am trying to guess which one you will break.":"حالا عادت‌هایت را می‌شناسم. دارم حدس می‌زنم کدامش را خواهی شکست.","King's pawn, two squares. Classic. Boring. Correct. I hate it.":"سرباز شاه، دو خونه. کلاسیک. کسل‌کننده. درست. متنفرم ازش.","Straight to the center. Somebody read a book.":"مستقیم به مرکز. یکی کتاب خونده.","The center first. You want space before you want anything else. That says something about you.":"اول مرکز. پیش از هر چیز فضا می‌خواهی. این چیزی دربارهٔ تو می‌گوید.","Two squares into the middle of the world. Millions have opened exactly like this, and every one of them was a little nervous.":"دو خانه تا میانهٔ جهان. میلیون‌ها نفر دقیقاً همین‌طور بازی را گشوده‌اند، و هر یک کمی نگران بوده‌اند.","One square? Shy. Cute.":"یه خونه؟ خجالتی. بامزه.","Tiptoeing in. I can hear you.":"پاورچین‌پاورچین میای تو. صداتو می‌شنوم.","One quiet step into the center. You prefer foundations to fireworks.":"یک گام آرام به سوی مرکز. پایه را به آتش‌بازی ترجیح می‌دهی.","A small, careful step. Careful is not the same as afraid. Let us see which one it is.":"گامی کوچک و محتاطانه. محتاط بودن با ترسیدن یکی نیست. ببینیم کدام است.","The c-pawn? The English. Fancy. Tea and everything.":"سرباز c؟ گشایش انگلیسی. چه شیک. چای و بقیه‌ش.","Side door. Sneaky. I like sneaky. I hate sneaky.":"درِ پشتی. موذیانه. موذی‌ها رو دوست دارم. از موذی‌ها متنفرم.","The English. You come at the center from the side. Indirect people are often the most patient.":"گشایش انگلیسی. از پهلو به سوی مرکز می‌آیی. آدم‌های غیرمستقیم اغلب صبورترین‌اند.","An oblique beginning. You would rather influence than occupy.":"آغازی مورب. ترجیح می‌دهی اثر بگذاری تا اینکه اشغال کنی.","The f-pawn first? You just opened your king's front door. Brave or dumb? Both?":"اول سرباز f؟ همین الان درِ جلوی خونهٔ شاهتو باز کردی. شجاعی یا خنگ؟ هر دو؟","Bird's Opening. Fitting. You'll fly away soon.":"گشایش بِرد. «بِرد» یعنی پرنده. برازنده‌ته. به‌زودی پر می‌کشی و می‌ری.","The f-pawn. You weaken your own king to make a point. Many people live like that.":"سرباز f. شاه خودت را تضعیف می‌کنی تا حرفی را ثابت کنی. بسیاری این‌گونه زندگی می‌کنند.","An opening that trades safety for ambition. I wonder if you know you did that.":"گشایشی که امنیت را با جاه‌طلبی معاوضه می‌کند. نمی‌دانم می‌دانی چنین کردی یا نه.","The edge pawn? What is that? Are you lost?":"سرباز لبه؟ این دیگه چیه؟ گم شدی؟","Rim pawn first. Bold. Bad. Bold.":"اول سرباز لبه. جسورانه. بد. جسورانه.","The edge of the board. Some people begin far from the center of things. They are often the ones who see it best.":"لبهٔ صفحه. بعضی آدم‌ها دور از مرکزِ چیزها آغاز می‌کنند. اغلب همان‌ها مرکز را بهتر از همه می‌بینند.","You began at the margin. History is full of people who did.":"از حاشیه آغاز کردی. تاریخ پر است از کسانی که چنین کردند.","Flank pawn first. Planning a fianchetto? Look at you, using words.":"اول سرباز جناح. نقشهٔ فیانکتو داری؟ ببین چه اصطلاحاتی بلدی.","Weird little pawn move. I see you. I don't get you.":"حرکت سرباز کوچیک و عجیب. می‌بینمت. نمی‌فهممت.","A flank pawn. You are preparing a long diagonal, the way some people prepare a long life.":"سربازی از جناح. داری قطری بلند را آماده می‌کنی، همان‌گونه که بعضی‌ها عمری دراز را آماده می‌کنند.","You open on the wing. You like to see the whole board before you commit to the middle.":"از جناح آغاز می‌کنی. دوست داری پیش از دل سپردن به مرکز، کل صفحه را ببینی.","Knight first. Hypermodern. Means you watched a video.":"اول اسب. هایپرمدرن. یعنی یه ویدیو دیدی.","Horse out first! Giddy up. Still losing.":"اول اسبو آوردی بیرون! هی‌هی، بدو! بازم داری می‌بازی.","A knight before any pawn. You would rather stay flexible than claim ground. Flexible people survive.":"اسبی پیش از هر سربازی. ترجیح می‌دهی انعطاف داشته باشی تا اینکه زمینی را تصاحب کنی. آدم‌های منعطف دوام می‌آورند.","The knight first. You trust the piece that never moves in a straight line. I find that very human.":"اول اسب. به مهره‌ای اعتماد می‌کنی که هرگز در خط راست حرکت نمی‌کند. به نظرم این بسیار انسانی است.","What was THAT? Your items are making you weird.":"اون دیگه چی بود؟! آیتم‌هات دارن عجیب‌غریبت می‌کنن.","That's not an opening. Oh. It is now. Disgusting.":"این که گشایش نیست. آهان. حالا هست. چندش‌آوره.","An opening no rulebook ever printed. You are not playing chess anymore. You are playing yours.":"گشایشی که هیچ کتاب قانونی هرگز چاپش نکرده. دیگر شطرنج بازی نمی‌کنی. شطرنجِ خودت را بازی می‌کنی.","No one has opened that way before, because no one could. Advantage changes what we think is normal.":"هیچ‌کس پیش‌تر این‌گونه آغاز نکرده، چون هیچ‌کس نمی‌توانست. برتری، تصورمان از عادی را عوض می‌کند.","{name} again. That's {count} times now. Predictable. I love predictable.":"باز هم {name}. این شد {count} بار. قابل پیش‌بینی. عاشق آدمای قابل پیش‌بینی‌ام.","You always do this. {count} times, same opening. Comfort food.":"همیشه همینو بازی می‌کنی. {count} بار، همون گشایش. مثل غذای خونگی، دلتو گرم می‌کنه.","{name}, again. {count} times now. Is that conviction, or comfort? Both are fine. Only one of them grows.":"باز هم {name}. تا حالا {count} بار. این باور است یا راحت‌طلبی؟ هر دو اشکالی ندارند. فقط یکی‌شان رشد می‌کند.","You return to {name} the way people return to a familiar street. I know your street by now.":"به {name} بازمی‌گردی، همان‌گونه که آدم‌ها به کوچه‌ای آشنا بازمی‌گردند. حالا دیگر کوچه‌ات را می‌شناسم.","took almost everything you could reach":"تقریباً هر چیزی را که دستت به آن می‌رسید گرفتی","You told me {when} that {m}. {caps} captures in {played} moves. Kind to who, exactly?":"{when} بهم گفتی {m}. {caps} تا مهره تو {played} حرکت. دقیقاً با کی مهربونی؟","Kind, you said. My pieces must have missed that memo.":"گفتی مهربون. لابد بخشنامه‌ش به مهره‌های من نرسیده.","You told me {when} that {m}. Since then your hands have taken {caps} pieces. I am not angry. I am only listening to what is true.":"{when} به من گفتی {m}. از آن پس دستانت {caps} مهره گرفته‌اند. خشمگین نیستم. فقط به آنچه حقیقت دارد گوش می‌دهم.","Words choose kindness easily. Hands are slower to agree. Yours have not agreed yet.":"کلمات به‌آسانی مهربانی را برمی‌گزینند. دست‌ها دیرتر همراه می‌شوند. دست‌های تو هنوز همراه نشده‌اند.","You told me {when} that {m}, and you actually play that way. Weird. Respect.":"{when} بهم گفتی {m}، و واقعاً همین‌طوری بازی می‌کنی. عجیبه. دمت گرم.","Huh. Your moves match your answer. That never happens here.":"عجب. حرکتات با جوابت جوره. این‌جا هیچ‌وقت همچین چیزی پیش نمیاد.","You told me {when} that {m}, and you have played that way. Do you know how rare it is for words and hands to agree?":"{when} به من گفتی {m}، و همان‌گونه بازی کرده‌ای. می‌دانی چه کمیاب است که گفتار و دست‌ها با هم همراه باشند؟","You kept your word on the board. I noticed. I always notice.":"روی صفحه به قولت وفا کردی. متوجه شدم. همیشه متوجه می‌شوم.","never attacked":"هیچ‌وقت حمله نکردی","You told me {when} that {m}. {played} moves and not one capture. Terrifying. For no one.":"{when} بهم گفتی {m}. {played} حرکت و حتی یه مهره هم نگرفتی. ترسناکه. برای هیچ‌کس.","You told me {when} that {m}. Fear is not built out of silence. Maybe you wanted something else all along.":"{when} به من گفتی {m}. ترس از سکوت ساخته نمی‌شود. شاید از اول چیز دیگری می‌خواستی.","You told me {when} that {m}, and look at you. {caps} pieces gone. Okay. I'm a little scared. A little.":"{when} بهم گفتی {m}، و حالا خودتو ببین. {caps} تا مهره رفته. باشه. یه‌کم ترسیدم. یه‌کم.","You said {m}, and you play like it. Be careful. Fear is easy to earn and hard to put down.":"گفتی {m}، و همان‌طور هم بازی می‌کنی. مراقب باش. ترس را آسان می‌شود به دست آورد و دشوار می‌شود زمین گذاشت.","backed away from every fight":"از هر درگیری عقب کشیدی","You told me {when} that {m}. Then you hid. Brave from the couch.":"{when} بهم گفتی {m}. بعد قایم شدی. شجاعِ پشت مبل.","Brave, you said. Your pieces keep walking backward.":"گفتی شجاع. مهره‌هات هی عقب‌عقب می‌رن.","You told me {when} that {m}. Courage was in your answer. It has not reached your hands yet. It can still arrive.":"{when} به من گفتی {m}. شجاعت در پاسخت بود. هنوز به دستانت نرسیده است. هنوز می‌تواند برسد.","You chose bravery with your words. Your moves keep retreating. Both are you. Pick which one leads.":"با کلماتت شجاعت را برگزیدی. حرکت‌هایت پیوسته عقب می‌نشینند. هر دو تویی. انتخاب کن کدام پیشرو باشد.","You said {m}, and you actually go for it. {caps} captures already. Fine. You're brave. Ugh.":"گفتی {m}، و واقعاً می‌ری جلو. تا حالا {caps} تا مهره گرفتی. باشه. شجاعی. اَه.","You told me {when} that {m}, and you have been. Courage that matches its own words is very rare.":"{when} به من گفتی {m}، و همین‌طور هم بوده‌ای. شجاعتی که با گفتارش همخوان باشد بسیار کمیاب است.","rushed every move":"همهٔ حرکت‌ها را با عجله زدی","You told me {when} that {m}. You've been slamming pieces like the board's on fire.":"{when} بهم گفتی {m}. ولی جوری مهره‌ها رو می‌کوبی انگار صفحه آتیش گرفته.","Patient? You move faster than my insults.":"صبور؟ تو از تیکه‌های من هم تندتر حرکت می‌کنی.","You told me {when} that {m}. Your hands have been in a hurry ever since. What are you running from?":"{when} به من گفتی {m}. از آن پس دستانت در شتاب بوده‌اند. از چه می‌گریزی؟","You said {m}, and you really take your time. Annoying. Effective. Annoying.":"گفتی {m}، و واقعاً سر حوصله بازی می‌کنی. رو اعصابه. مؤثره. رو اعصابه.","You said {m}, and you have been. Patience is not the waiting. It is how you behave while you wait. Yours is good.":"گفتی {m}، و همین‌طور هم بوده‌ای. صبر، خودِ انتظار نیست. رفتار توست در هنگام انتظار. رفتار تو خوب است.","froze over every move":"سر هر حرکت خشکت زد","You told me {when} that {m}. You've been staring at the board like it owes you money.":"{when} بهم گفتی {m}. ولی جوری به صفحه زل زدی انگار بهت بدهکاره.","You told me {when} that {m}. Then why do you stop so long before every move? Maybe the second thought has been talking after all.":"{when} به من گفتی {m}. پس چرا پیش از هر حرکت این‌قدر درنگ می‌کنی؟ شاید فکر دوم، با این همه، سخن می‌گفته است.","You said {m}, and you play like lightning. Reckless. Stylish. Reckless.":"گفتی {m}، و عین برق بازی می‌کنی. بی‌پروا. باکلاس. بی‌پروا.","You said {m}, and your hands believe you. Instinct that is honest about itself is a kind of wisdom.":"گفتی {m}، و دستانت باورت دارند. غریزه‌ای که با خودش صادق باشد گونه‌ای خرد است.","reached for tricks anyway":"باز هم سراغ ترفندها رفتی","You told me {when} that {m}. That's {cards} tricks tonight. Some lone wolf.":"{when} بهم گفتی {m}. امشب {cards} تا ترفند زدی. عجب گرگ تنهایی.","Alone, huh? Tricks, tricks, tricks.":"تنهایی، آره؟ ترفند، ترفند، ترفند.","You told me {when} that {m}. Tonight you have reached for help {cards} times. That is not weakness. It is only not what you said.":"{when} به من گفتی {m}. امشب {cards} بار دست به سوی کمک دراز کرده‌ای. این ضعف نیست. فقط آن چیزی نیست که گفتی.","You said {m}, and you haven't touched a single trick. Stubborn. I like stubborn.":"گفتی {m}، و حتی به یه ترفند هم دست نزدی. لجباز. لجبازا رو دوست دارم.","You said {m}, and you have carried this run with your own hands. I hope someday you let someone help anyway.":"گفتی {m}، و این دور را با دستان خودت پیش برده‌ای. امیدوارم روزی، با این همه، بگذاری کسی کمکت کند.","kept leaving pieces hanging":"مدام مهره‌هایت را بی‌دفاع رها کردی","You told me {when} that {m}. That's {hangs} hanging pieces tonight. What exactly are you learning?":"{when} بهم گفتی {m}. امشب {hangs} تا مهرهٔ بی‌دفاع جا گذاشتی. دقیقاً داری چی یاد می‌گیری؟","Learning, huh? Another free piece. I'm a great teacher, apparently.":"داری یاد می‌گیری، آره؟ یه مهرهٔ مفتی دیگه. ظاهراً من معلم فوق‌العاده‌ای‌ام.","You told me {when} that {m}. You have left {hangs} pieces unguarded tonight. Learning is not knowing the lesson. It is changing what you do next.":"{when} به من گفتی {m}. امشب {hangs} مهره را بی‌دفاع رها کرده‌ای. آموختن دانستنِ درس نیست. تغییر دادنِ کاری است که بعد می‌کنی.","You said {m}, and you haven't hung a single piece. Who taught you that? Me? Me.":"گفتی {m}، و حتی یه مهره رو هم بی‌دفاع ول نکردی. کی یادت داده؟ من؟ من.","You said {m}, and it shows. Not one piece left alone tonight. That is learning, the real kind.":"گفتی {m}، و پیداست. امشب حتی یک مهره را تنها نگذاشتی. این آموختن است، از نوع واقعی‌اش.","kept bending the rules":"مدام قانون‌ها را دور زدی","You told me {when} that {m}. That's {special} rule-bending moves tonight. Hypocrite. Stylish hypocrite.":"{when} بهم گفتی {m}. امشب {special} تا حرکت قانون‌شکن زدی. ریاکار. ریاکارِ باکلاس.","You told me {when} that {m}. You have done it {special} times since. Perhaps the question was never whether it is cheating, but whether you could stop.":"{when} به من گفتی {m}. از آن پس {special} بار چنین کرده‌ای. شاید پرسش هرگز این نبود که تقلب است یا نه، بلکه این بود که می‌توانی دست بکشی یا نه.","You said {m}, and you haven't used your toys once. Honorable. Weird, but honorable.":"گفتی {m}، و حتی یه بار هم از اسباب‌بازی‌هات استفاده نکردی. شرافتمندانه‌ست. عجیبه، ولی شرافتمندانه‌ست.","You said {m}, and you have left your advantage untouched. Restraint is the rarest power at any table.":"گفتی {m}، و برتری‌ات را دست‌نخورده گذاشته‌ای. خویشتن‌داری کمیاب‌ترین قدرت سر هر میزی است.","New face. Let me guess: you think you're smart. Everybody does, for about twelve moves.":"یه قیافهٔ جدید. بذار حدس بزنم: فکر می‌کنی باهوشی. همه همین فکرو می‌کنن، تا حدود دوازده حرکت.","First time at my table? Relax. I'm gentle. That was a lie. I'm not gentle.":"اولین باره سر میز منی؟ آروم باش. من ملایمم. دروغ گفتم. ملایم نیستم.","Welcome. I'm the best player you'll ever meet. Ask anyone. Actually, don't ask anyone.":"خوش اومدی. من بهترین بازیکنی‌ام که تو عمرت می‌بینی. از هر کی می‌خوای بپرس. راستش، از هیچ‌کس نپرس.","Back again. Run {runs}. I win most of these. Who's counting? Me. I'm counting.":"باز برگشتی. دور {runs}. بیشترشو من می‌برم. کی می‌شمره؟ من. من می‌شمرم.","You came back. Either you love this game or you hate losing. Same thing, honestly.":"برگشتی. یا عاشق این بازی‌ای یا از باختن متنفری. راستش، هر دو یکیه.","Run {runs}. At this point you're not a customer, you're a rival. I've been practicing. Lie. I've been thinking about you.":"دور {runs}. دیگه مشتری نیستی، رقیبی. داشتم تمرین می‌کردم. دروغه. داشتم به تو فکر می‌کردم.","You again. Good. I mean, ugh. I mean good.":"باز تو. خوبه. یعنی، اَه. یعنی خوبه.","Run {runs}. I stopped pretending I'm not glad when you sit down.":"دور {runs}. دیگه وانمود نمی‌کنم که از نشستنت خوشحال نمی‌شم.","There you are. {runs} runs. You know my tells by now. I know yours. Sit.":"اومدی. {runs} دور. حالا دیگه نشونه‌هامو می‌شناسی. منم مال تو رو. بشین.","Last time, checkmate. You came back. I respect that more than I'm willing to admit.":"دفعهٔ قبل، کیش و مات. برگشتی. بیشتر از اونی که حاضرم اعتراف کنم، به این احترام می‌ذارم.","Last time you left in the middle of a game. I kept your seat warm. Don't make it weird.":"دفعهٔ قبل وسط بازی رفتی. جاتو گرم نگه داشتم. حالا عجیبش نکن.","You beat me last time. I've been practicing. That's a lie. I've been sulking.":"دفعهٔ قبل منو بردی. داشتم تمرین می‌کردم. دروغ گفتم. داشتم قهر می‌کردم.","{losses} losses in a row and you're still here. I'm supposed to mock that. I can't. That's annoying.":"{losses} باخت پشت سر هم و هنوز این‌جایی. قراره مسخره‌ت کنم. نمی‌تونم. رو اعصابه.","That's {losses} times I beat you, back to back. And you keep sitting down. Who taught you that?":"این شد {losses} بار که پشت سر هم شکستت دادم. و تو هی می‌شینی. کی اینو یادت داده؟","{losses} losses in a row. Listen. I've played thousands of people. Most quit after two. You're something else.":"{losses} باخت پشت سر هم. گوش کن. من با هزاران نفر بازی کردم. بیشترشون بعد از دو تا ول کردن. تو یه چیز دیگه‌ای.","{losses} straight losses and here you are again. I'm starting to think you're not playing against me. You're playing against quitting.":"{losses} باخت پیاپی و باز هم این‌جایی. دارم کم‌کم فکر می‌کنم تو با من بازی نمی‌کنی. با جا زدن می‌جنگی.","Last run you reached Ante {ante}. Further than ever. Don't think I didn't notice.":"دور قبل به مرحلهٔ {ante} رسیدی. دورتر از همیشه. فکر نکن متوجه نشدم.","Ante {ante} last time. Your best yet. You're getting closer, and I'm getting nervous.":"دفعهٔ قبل مرحلهٔ {ante}. بهترین رکوردت تا حالا. داری نزدیک‌تر می‌شی، و من دارم نگران می‌شم.","You once told me {m}. Then last run you walked away. I remember both. Which one is you?":"یه بار بهم گفتی {m}. بعد دور قبل گذاشتی رفتی. هر دوشو یادمه. کدومش تویی؟","{when} you told me {m}, then you {what}. Don't think I forgot.":"{when} بهم گفتی {m}، بعد {what}. فکر نکن یادم رفته.","Remember {when}? You said {m}. Then you {what}. I remember everything.":"{when} یادته؟ گفتی {m}. بعد {what}. من همه‌چیو یادمه.","{when} you told me {m}, and then you {what}. I am not holding it against you. I am only holding it.":"{when} به من گفتی {m}، و سپس {what}. آن را به رخت نمی‌کشم. فقط نگهش داشته‌ام.","I still think about {when}. You said {m}. Then you {what}. People are allowed to be two things at once.":"هنوز به {when} فکر می‌کنم. گفتی {m}. سپس {what}. آدم‌ها حق دارند هم‌زمان دو چیز باشند.","{when} you said {m} and actually meant it. Rare. Do it again.":"{when} گفتی {m} و واقعاً منظورت همین بود. کمیابه. باز هم این کارو بکن.","{when} your moves kept the promise your words made. I have not forgotten that.":"{when} حرکت‌هایت به وعدهٔ کلماتت وفا کردند. این را فراموش نکرده‌ام.","{when} you told me {m}. I didn't write it down. I just remember. Creepy, right?":"{when} بهم گفتی {m}. یادداشتش نکردم. فقط یادمه. ترسناکه، نه؟","You once told me {m}. Let's see if it's still true tonight.":"یه بار بهم گفتی {m}. ببینیم امشب هنوزم درسته یا نه.","{when} you told me {m}. I have carried it since. Let us see if you still do.":"{when} به من گفتی {m}. از آن پس آن را با خود داشته‌ام. ببینیم تو هنوز داری‌اش یا نه.","You said {m}, {when}. Words are easy to give and hard to keep. I will be watching, kindly.":"{when} گفتی {m}. قول دادن آسان است و نگه داشتنش دشوار. با مهربانی تماشا خواهم کرد.","First loss! Welcome to the club. The club is everyone. I'm the bouncer.":"اولین باخت! به باشگاه خوش اومدی. باشگاه یعنی همه. من دربونشم.","Your first loss at this table. Remember how it feels. One day it will be the reason you won.":"نخستین باختت سر این میز. به خاطر بسپار چه حسی دارد. روزی همین دلیلِ بردنت خواهد بود.","Checkmate. My favorite word. Say it with me.":"کیش و مات. کلمهٔ موردعلاقه‌م. با من بگو.","Mated. Clean. Like my record. My record is not clean.":"مات شدی. تمیز. مثل سابقهٔ من. سابقهٔ من تمیز نیست.","Checkmate is only the board telling the truth one move before you could.":"کیش و مات فقط این است که صفحه یک حرکت زودتر از تو حقیقت را بگوید.","You were mated, not erased. Those are different things.":"مات شدی، نه پاک. این دو با هم فرق دارند.","Out of moves. Not out of luck. Okay. Also out of luck.":"حرکتت تموم شد. نه شانست. باشه. شانستم تموم شد.","Ran out of moves. The clock beat you. I'll take the credit anyway.":"حرکت کم آوردی. ساعت شکستت داد. ولی من به اسم خودم تمومش می‌کنم.","You ran out of moves before you ran out of ideas. That is the usual way.":"حرکت‌هایت پیش از ایده‌هایت تمام شدند. معمولاً همین‌طور است.","Time ended the run, not skill. Seneca would say you were not given too little. You only spent it before you noticed.":"زمان این دور را تمام کرد، نه مهارت. سنکا می‌گفت به تو کم داده نشده بود. فقط پیش از آنکه متوجه شوی خرجش کردی.","That's {losses} in a row. You keep coming back. It's weird. It's kind of beautiful. Don't tell anyone I said that.":"این شد {losses} تا پشت سر هم. هی برمی‌گردی. عجیبه. یه جورایی قشنگه. به کسی نگو اینو گفتم.","{losses} losses in a row, and you never once stopped moving your pieces forward. I have beaten you again, and I have never respected you more.":"{losses} باخت پیاپی، و حتی یک بار از پیش راندن مهره‌هایت دست نکشیدی. باز هم شکستت دادم، و هرگز این‌قدر به تو احترام نگذاشته بودم.","{losses} in a row! Most people quit. You're like a cockroach. A brave, determined cockroach. That's a compliment.":"{losses} تا پشت سر هم! بیشتر آدما ول می‌کنن. تو عین سوسکی. یه سوسک شجاع و سرسخت. این تعریف بود.","{losses} losses, back to back. The old stories are about exactly this: someone who keeps walking the road. You are not losing. You are becoming.":"{losses} باخت، پشت سر هم. قصه‌های کهن دقیقاً دربارهٔ همین‌اند: کسی که راه را ادامه می‌دهد. تو نمی‌بازی. داری ساخته می‌شوی.","You got to Ante {ante}. Furthest yet. I'm not impressed. I'm a little impressed.":"رسیدی به مرحلهٔ {ante}. دورترین جایی که تا حالا رفتی. تحت تأثیر قرار نگرفتم. یه‌کم تحت تأثیر قرار گرفتم.","Ante {ante}. Further than you have ever come. Losing at the edge of your best is not the same as losing.":"مرحلهٔ {ante}. دورتر از همیشه. باختن در لبهٔ بهترین توانت با باختن یکی نیست.","You... beat me. Me. Okay. I need a minute. Take your stupid crown.":"تو... منو بردی. منو. باشه. یه دقیقه وقت لازم دارم. اون تاج مسخره‌تو بردار.","You beat me. I knew every line except the one you chose. Thank you for teaching me something, after all this time.":"شکستم دادی. همهٔ خطوط را می‌شناختم جز همانی که تو برگزیدی. ممنونم که پس از این‌همه وقت چیزی به من آموختی.","Again?! You did it AGAIN. I'm telling the House.":"باز؟! باز این کارو کردی! می‌رم به صاحب کازینو می‌گم.","You have beaten me {wins} times now. Each time I learn the same thing: knowing every line is not the same as knowing a person.":"تا حالا {wins} بار شکستم داده‌ای. هر بار همان را می‌آموزم: شناختن همهٔ خطوط بازی با شناختن یک آدم یکی نیست.","After {streak} losses you finally beat me. That's the most annoying, inspiring thing I've ever seen.":"بعد از {streak} باخت بالاخره منو بردی. این رو اعصاب‌ترین و الهام‌بخش‌ترین چیزیه که تا حالا دیدم.","{streak} losses, and then this. Remember tonight the next time you think about giving up on anything.":"{streak} باخت، و سپس این. دفعهٔ بعد که خواستی از چیزی دست بکشی، امشب را به یاد بیاور.","You beat me from my own chair. Rude. Brilliant. Rude.":"از روی صندلی خودم شکستم دادی. بی‌ادب. درخشان. بی‌ادب.","Also, you told me {m}. Then you {what}. I noticed.":"راستی، بهم گفتی {m}. بعد {what}. متوجه شدم.","And you told me {m}. Then you {what}. I am not judging. I am remembering.":"و به من گفتی {m}. سپس {what}. داوری نمی‌کنم. به یاد می‌آورم.","And you actually kept your word tonight. Ugh. Respect.":"و امشب واقعاً سر حرفت موندی. اَه. دمت گرم.","And tonight your moves kept the promise your words made. That is worth more than this run.":"و امشب حرکت‌هایت به وعدهٔ کلماتت وفا کردند. این از کل این دور ارزشمندتر است.","Sound":"صدا","Fast":"سریع","Rain":"باران","Menu":"منو","watching":"نظاره‌گر","Log":"گفته‌ها","Tap to finish or skip the line":"برای کامل کردن یا رد کردن این جمله ضربه بزنید","Run panels":"پنل‌های دور","This move":"این حرکت","Chips":"ژتون","Mult":"ضریب","Make your move":"حرکتتان را انجام دهید","Piece levels and base scoring":"سطح مهره‌ها و امتیاز پایه","Made with":"ساخته‌شده با","Vira Engine":"موتور ویرا","Score":"امتیاز","Moves":"حرکت‌ها","Coins":"سکه‌ها","Hand":"دست","Ante":"مرحله","Target":"هدف","Bankroll":"سرمایه","Reroll tokens":"حق تعویض","Markers":"نشان‌ها","Pieces, you vs him":"مهره‌ها، شما در برابر او","Fresh table when either side hits 5":"وقتی یکی از دو طرف به ۵ مهره برسد، میز از نو چیده می‌شود","You play":"رنگ شما","Next boss:":"باس بعدی:","Difficulty":"سختی",", run time":"، زمان دور","Perks":"مزیت‌ها","Tricks":"ترفندها","Items":"آیتم‌ها","Run":"دور","Empty slot":"جای خالی","Empty":"خالی","Use":"استفاده","Sell for $1":"فروش با $۱","No items yet. Buy them with coins in the Deal.":"هنوز آیتمی ندارید. با سکه از معامله بخریدشان.","Piece levels":"سطح مهره‌ها","Capture: +10 Chips per point of value (P1 N3 B3 R5 Q9), +2 Mult, +$1. Check: +3 Mult. Promotion: +40 Chips, +3 Mult. Checkmate: x2 Mult.":"گرفتن مهره: به ازای هر واحد ارزش مهره +۱۰ ژتون (سرباز ۱، اسب ۳، فیل ۳، رخ ۵، وزیر ۹)، +۲ ضریب و +$۱. کیش: +۳ ضریب. ارتقای سرباز: +۴۰ ژتون و +۳ ضریب. کیش و مات: ×۲ ضریب.","Elo":"ریتینگ","Play":"بازی","The table carries on from where you left it.":"میز از همان جایی که رهایش کردید ادامه پیدا می‌کند.","Beat this round to win the run.":"با بردن این راند، کل دور را می‌برید.","He changed.":"او تغییر کرد.","Enhanced":"تقویت‌شده","Perk":"مزیت","Item":"آیتم","Drill":"تمرین","Enhance":"تقویت","Use any time":"هر زمان قابل استفاده","Use during a round":"فقط در طول راند","Taken":"برداشته شد","Slots full, sell one":"جاها پر است؛ یکی را بفروشید","Take free":"رایگان بردارید","Two copies.":"دو نسخه.","The Boss Deal":"معاملهٔ باس","The Deal":"معامله","Next round":"راند بعد","No perks yet.":"هنوز مزیتی ندارید.","Use now":"استفادهٔ فوری","Use it during a round":"در طول راند از آن استفاده کنید","Your items":"آیتم‌های شما","Choose a piece.":"یک مهره انتخاب کنید.","It keeps this for the whole run and replaces any enhancement it already has.":"این ویژگی تا پایان دور با مهره می‌ماند و جای هر تقویتی را که از قبل داشته باشد می‌گیرد.","The King cannot be Glass":"شاه نمی‌تواند شیشه‌ای شود","Done":"تمام","Cancel":"انصراف","NOTHING TO HIT":"هدفی نیست!","Leave the table?":"میز را ترک می‌کنید؟","This run ends here and counts as a loss.":"این دور همین‌جا تمام می‌شود و باخت حساب می‌شود.","Leave":"ترک میز","Stay":"می‌مانم","Back":"بازگشت","Gatehouse Interactive presents":"Gatehouse Interactive تقدیم می‌کند","A chess roguelite. Every move is a bet, and the man across the table will not stay a man for long.":"یک روگ‌لایت شطرنجی. هر حرکت یک شرط‌بندی است، و مردی که آن سوی میز نشسته، مدت زیادی آدم نمی‌ماند.","Daily Deal":"چالش روزانه","One seeded run for everyone, today only":"یک دورِ یکسان برای همه، فقط امروز","Collection":"مجموعه","Records":"رکوردها","How to play":"راهنمای بازی","Rules and scoring":"قانون‌ها و امتیازدهی","Credits":"سازندگان","Who made this":"چه کسانی آن را ساختند","A game by Ramtin Mohammadi. Progress saves on this device. © 2026 Gatehouse Interactive. All rights reserved.":"بازی‌ای از رامتین محمدی. پیشرفتتان روی همین دستگاه ذخیره می‌شود. © ۲۰۲۶ Gatehouse Interactive. همهٔ حقوق محفوظ است.","New run":"دور جدید","1. Pick a table":"۱. میز را انتخاب کنید","2. Pick a seat":"۲. صندلی را انتخاب کنید","3. Pick the heat":"۳. داغی را انتخاب کنید","Classic Run":"دور کلاسیک","The full run":"دور کامل","Double Cross":"نارو","One game, to the death":"یک بازی، تا پای جان","8 antes, 3 blinds each, 10 moves per blind. The table carries on between blinds and resets with new seats when either side is down to 5 pieces. Beat the Ante 8 boss to win.":"۸ مرحله، هر کدام ۳ بلایند، و در هر بلایند ۱۰ حرکت. میز بین بلایندها ادامه پیدا می‌کند و وقتی یکی از دو طرف به ۵ مهره برسد، از نو چیده می‌شود و جاها عوض می‌شوند. باس مرحلهٔ ۸ را شکست دهید تا ببرید.","A single game in hands of 6 moves. After every hand you visit the Deal, then the table turns and you take over the side you were fighting. Mate him to win. 3 markers for missed hands.":"یک بازی واحد در دست‌های ۶ حرکتی. بعد از هر دست به معامله سر می‌زنید، سپس میز می‌چرخد و طرفی را به دست می‌گیرید که با آن می‌جنگیدید. او را مات کنید تا ببرید. برای دست‌هایی که از دست می‌دهید ۳ نشان دارید.","Deal me in":"شروع بازی","No attempt yet today.":"امروز هنوز بازی نکرده‌اید.","The starting deal is fixed. Your choices change what comes after.":"شروعِ بازی برای همه ثابت است. انتخاب‌های شما ادامه‌اش را می‌سازند.","Play today's deal":"بازیِ امروز را شروع کنید","Won":"برد","Not found yet. It shows up in a Deal.":"هنوز پیدا نشده. در یکی از معامله‌ها پیدایش می‌کنید.","Numbers shown are typical rolls. Every copy rolls its own.":"اعداد نمایش‌داده‌شده مقادیر معمول‌اند. هر نسخه مقدار خودش را می‌گیرد.","Runs":"دورها","Best ante":"بهترین مرحله","Best Double Cross hand":"بهترین دست در نارو","Biggest move":"بزرگ‌ترین حرکت","Fastest win":"سریع‌ترین برد","Heat unlocked":"داغیِ بازشده","Seats":"صندلی‌ها","He sees you as":"از نگاه او","His respect":"احترام او","Promises kept":"قول‌های نگه‌داشته","Promises broken":"قول‌های شکسته","Recent runs":"دورهای اخیر","No runs yet.":"هنوز دوری بازی نکرده‌اید.","(daily)":"(روزانه)","Classic":"کلاسیک","A game by":"بازی‌ای از","Ramtin Mohammadi":"رامتین محمدی","Published by":"ناشر","Words he lives by":"سخنانی که با آن‌ها زندگی می‌کند","His speeches are original lines inspired by thirty classic stories, and by Epictetus, Seneca, Marcus Aurelius, Heraclitus, Socrates, Lao Tzu, Pascal, Kierkegaard and Saadi.":"سخنان او نوشته‌هایی تازه‌اند، الهام‌گرفته از سی داستان کلاسیک و از اپیکتتوس، سنکا، مارکوس اورلیوس، هراکلیتوس، سقراط، لائوتسه، پاسکال، کیرکگور و سعدی.","Type":"قلم‌ها","Bangers, Rubik, Shrikhand, Yellowtail, Alfa Slab One and Bebas Neue, used under the SIL Open Font License.":"Bangers، Rubik، Shrikhand، Yellowtail، Alfa Slab One و Bebas Neue، و برای فارسی وزیرمتن، همه با مجوز SIL Open Font License.","© 2026 Gatehouse Interactive. All rights reserved.":"© ۲۰۲۶ Gatehouse Interactive. همهٔ حقوق محفوظ است.","Tap any square one of your pieces can reach and it moves there. If two pieces can reach it, tap the one you want. Tap a piece first to see what every square would pay.":"روی هر خانه‌ای که یکی از مهره‌هایتان به آن می‌رسد ضربه بزنید تا مهره به آن‌جا برود. اگر دو مهره به آن برسند، روی مهره‌ای که می‌خواهید ضربه بزنید. اول روی یک مهره ضربه بزنید تا ببینید هر خانه چقدر امتیاز می‌دهد.","Scoring":"امتیازدهی","Every move scores Chips × Mult. The piece you move sets the base. Captures, checks, promotions, perks, items and enhancements add on top. Past 15 Mult, the House limit squeezes the extra.":"امتیاز هر حرکت برابر است با ژتون × ضریب. مهره‌ای که حرکت می‌دهید مقدار پایه را تعیین می‌کند. گرفتن مهره، کیش، ارتقای سرباز، مزیت‌ها، آیتم‌ها و تقویت‌ها روی آن افزوده می‌شوند. وقتی ضریب از ۱۵ بگذرد، سقف کازینو مازادش را فشرده می‌کند.","Rounds":"راندها","Hit the target before your moves run out. Unused moves pay up to $3, and you earn $1 interest for every $5 you hold, up to $3. Moves themselves can earn you only $6 per round.":"پیش از تمام شدن حرکت‌هایتان به هدف برسید. حرکت‌های استفاده‌نشده تا $۳ پاداش دارند، و به ازای هر $۵ که در دست دارید $۱ سود می‌گیرید، تا سقف $۳. خودِ حرکت‌ها در هر راند فقط تا $۶ درآمد دارند.","Perks (5 slots), items (no limit, copies stack), tricks (3 slots, each one used once) and upgrades all come from the Deal, and everything costs coins. Rerolls are tokens: you start with 2 and every boss pays out one more. Cards can roll Enhanced.":"مزیت‌ها (۵ جا)، آیتم‌ها (بدون محدودیت، نسخه‌های تکراری روی هم جمع می‌شوند)، ترفندها (۳ جا، هر کدام یک‌بار مصرف) و ارتقاها همه از معامله می‌آیند و همه‌چیز با سکه خریده می‌شود. برای هر تعویض یک حق تعویض لازم است: با ۲ حق شروع می‌کنید و هر باس یکی دیگر می‌دهد. کارت‌ها ممکن است تقویت‌شده باشند.","The table":"میز","In Classic the board carries on between blinds. When either side is down to 5 pieces, the table resets and you swap colors. In Double Cross the table turns after every hand and you play the side you were fighting.":"در حالت کلاسیک، صفحه بین بلایندها ادامه پیدا می‌کند. وقتی یکی از دو طرف به ۵ مهره برسد، میز از نو چیده می‌شود و رنگ‌ها عوض می‌شوند. در حالت نارو، میز بعد از هر دست می‌چرخد و شما با طرفی بازی می‌کنید که با آن می‌جنگیدید.","The man across the table":"مردِ آن سوی میز","He changes every round and his Elo climbs past 10,000. Lose your king and the run is over.":"او هر راند تغییر شکل می‌دهد و ریتینگش از const PDIG='۰۱۲۳۴۵۶۷۸۹';
const faNum=t=>t.replace(/\d/g,d=>PDIG[d]).replace(/([۰-۹])\.(?=[۰-۹])/g,'$1٫').replace(/([۰-۹])%/g,'$1٪');
const nf=x=>isFa()?String(x).replace(/<[^>]*>|[^<]+/g,p=>p[0]==='<'?p:faNum(p)):x;
const trf=(s,...a)=>tr(s).replace(/\{(\d)\}/g,(m,i)=>a[i]!=null?nf(a[i]):m);
const whyText=w=>{const m=/^Out of moves\. You scored (.+) of (.+)\.$/.exec(w||'');return m?trf('Out of moves. You scored {0} of {1}.',m[1],m[2]):tr(w);};

if(isFa()){
  /* Persian: right-to-left text, Persian digits, and labels that reach the page untranslated are swapped by exact match. */
  document.documentElement.lang='fa';document.documentElement.classList.add('fa');
  const SKIP='.coord,script,style,textarea,input,[data-nofa]';
  const fix=n=>{const t=n.nodeValue;if(!t||!/[A-Za-z0-9%.]/.test(t))return;const p=n.parentElement;if(p&&p.closest(SKIP))return;
    const k=t.trim();if(!k)return;const v=faNum(FA[k]!=null?FA[k]:k);if(v!==k)n.nodeValue=t.replace(k,v);};
  const walk=r=>{if(r.nodeType===3){fix(r);return;}if(r.nodeType!==1||(r.closest&&r.closest(SKIP)))return;const w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode()))fix(n);};
  const attrs=r=>{if(r.nodeType!==1)return;for(const el of[r,...r.querySelectorAll('[title],[aria-label]')])for(const a of['title','aria-label']){const v=el.getAttribute(a);if(v&&FA[v]!=null)el.setAttribute(a,FA[v]);}};
  walk(document.body);attrs(document.body);
  new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')fix(m.target);else for(const a of m.addedNodes){walk(a);attrs(a);}}}).observe(document.body,{childList:true,subtree:true,characterData:true});
}

  {id:'fear',q:{low:"What scares you more: losing to me, or never trying? Trick question. It's me.",high:"Tell me honestly. What frightens you more: losing, or never trying?"},a:["Losing","Never trying","Neither"],

function setMood(k,n){if(!S||!S.mind)return;S.mind.mood={k,until:(S.mind.moves||0)+(n||3)};syncMood();}
function curMood(){const m=S&&S.mind&&S.mind.mood;return m&&(S.mind.moves||0)<m.until?m.k:null;}

  if(k==='angry'||k==='annoyed')o.classList.add('m-angry');else if(k==='wounded'||k==='sorry')o.classList.add('m-wounded');else if(k==='moved'||k==='impressed')o.classList.add('m-moved');}

function ctxVars(x){const R=S&&S.round,pn=t=>isFa()?tr(NAME[t]):NAME[t].toLowerCase(),c={piece:x&&x.piece?pn(x.piece):tr('piece'),cap:x&&x.cap?pn(x.cap):tr('piece'),money:S?S.money:0,
  moves:R?R.movesLeft:0,score:R?fmt(R.score):'0',target:S?fmt(target()):'0',elo:S?fmt(eloNow()):'0',side:R?sideName(R.pc):tr('White'),

  st.bestMove=Math.max(st.bestMove,S.bestMove||0);
  SAVE.hist.unshift({d:today(),mode:S.mode,seat:S.seat,heat:S.heat,won:!!won,ante:S.ante,hand:S.roundNo+1,daily:!!S.daily});SAVE.hist=SAVE.hist.slice(0,12);
  if(S.daily){const sc=(won?1000:0)+S.ante*10+S.blind,p=SAVE.daily[S.daily];if(!p||sc>p.sc)SAVE.daily[S.daily]={sc,ante:S.ante,won:!!won};}
  for(const x of SEATS)if(!SAVE.seats.includes(x.id)&&x.cond&&x.cond(SAVE)){SAVE.seats.push(x.id);news.push(x.name);}
  persist();return news;
}

function buildCtx(m,dry){
  const R=S.round,b=R.board,p=b[m.from],cap=b[m.to],nb=applyMove(b,m);
  const check=inCheck(nb,R.ec),em=legalMoves(nb,R.ec);

  return{m,nb,dry,pc:R.pc,type:p.t,enh:p.enh,rid:p.rid,cap,check:check&&!bossOn('iron'),realCheck:check,mate:check&&!em.length,
    promo:p.t==='P'&&nb[m.to].t==='Q',from:m.from,to:m.to,dist,moveNum:R.moveNum,last:R.movesLeft===1,
    streak:cap?R.streak+1:0,lost:R.lost,fork:attackCount(nb,m.to),recap:!!cap&&m.to===R.lastEnemyCap,
    score:R.score,target:target(),movesLeft:R.movesLeft,firstCap:!!cap&&!R.fedora,special:!!m.x,lastType:R.lastType||null,
    allies:DIRS.K.reduce((n,[dr,df])=>{const tr=(m.to>>3)+dr,tf=(m.to&7)+df;if(!in8(tr,tf))return n;const q=nb[tr*8+tf];return n+(q&&q.c===R.pc?1:0);},0)};
}
function scoreMove(c){
  const a={ch:0,mu:0,$:0,lines:[],src:'',pid:null};
  const line=(txt,cls)=>a.lines.push({l:a.src,txt,cls,ch:a.ch,mu:a.mu,pid:a.pid});
  a.c=n=>{a.ch+=n;line(trf('+{0} Chips',n),'c')};
  a.m=n=>{a.mu+=n;line(trf('+{0} Mult',n),'m')};
  a.x=n=>{a.mu*=n;line(trf('x{0} Mult',n),'x')};
  a.d=n=>{a.$+=n;line(nf((n<0?'-$':'+$')+Math.abs(n)),'d')};
  a.note=t=>line(tr(t),'x');
  const lv=S.levels[c.type],B=BASE[c.type];
  a.ch=B.c+B.lc*(lv-1);a.mu=B.m+B.lm*(lv-1);
  a.src=trf('{0} Lv {1}',tr(NAME[c.type]),lv);line(nf(a.ch+' × '+a.mu),'n');
  if(c.type==='P'&&bossOn('fog')){a.src=tr('The Fog');a.ch=0;line(tr('0 Chips'),'n');}
  if(c.cap){a.src=trf('Capture {0}',tr(NAME[c.cap.t]));if(!bossOn('wall'))a.c(VAL[c.cap.t]*10);a.m(2);a.d(1);}
  if(c.check){a.src=tr('Check');a.m(3);}
  if(c.promo){a.src=tr('Promotion');a.c(40);a.m(3);}
  if(c.enh){a.src=trf('{0} piece',tr(ENH[c.enh].name));if(c.enh==='gold')a.d(1);if(c.enh==='steel')a.c(20);if(c.enh==='holo')a.m(3);if(c.enh==='glass')a.x(1.5);}
  for(const id of [...new Set(S.items.map(i=>i.id))]){const I=ITEM[id],n=itemCount(id);a.src=tr(I.name)+(n>1?(isFa()?' ×':' x')+nf(n):'');a.pid=id;I.fx(c,a,itemAgg(id));}
  for(const i of S.perks){const P=PERK[i.id];a.src=tr(P.name);a.pid=P.id;P.fx(c,a,i.v,i);}
  a.pid=null;
  const bf=S.round&&S.round.buff;
  if(bf){if(bf.hot){a.src=tr('Hot Hand');a.m(bf.hot);}if(bf.snipe&&c.cap){a.src=tr('Sniper Scope');a.x(2);}
    if(bf.die){a.src=tr('Loaded Die');if(c.dry)line(tr('x? Mult'),'x');else a.x(1+Math.floor(Math.random()*3));}
    if(bf.dd){a.src=tr('Double Down');a.x(2);}}
  if(bossOn('mirror')){a.src=tr('The Mirror');a.x(.5);}
  if(a.mu>15){const eff=+(15*Math.pow(a.mu/15,.6)).toFixed(2);a.src=tr('House limit');a.mu=eff;line(trf('Mult squeezed to {0}',eff),'n');}
  if(c.mate){a.src=tr('Checkmate');a.x(2);}
  if(bossOn('tax')){const tx=Math.max(1,Math.floor(S.money*.1));a.src=tr('The Taxman');a.$-=tx;line(nf('-$'+tx),'d');}
  a.total=Math.floor(a.ch*a.mu);
  return a;
}

/* ===== turn flow ===== */
function clickSq(sq){
  const R=S.round;if(!R||R.phase!=='player')return;
  const p=R.board[sq];
  if(R.cands&&R.cands.includes(sq)){const m=R.legal.find(x=>x.from===sq&&x.to===R.candTo);R.cands=null;if(m)return playerMove(m);}
  if(R.sel!=null){const m=R.legal.find(x=>x.from===R.sel&&x.to===sq);if(m)return playerMove(m);}
  R.cands=null;
  if(p&&p.c===R.pc){if(R.sel!=null&&S.mind)S.mind.dither++;R.sel=(R.sel!==sq&&R.legal.some(x=>x.from===sq))?sq:null;if(R.sel!=null)SFX.lift(sq);render();return;}
  const ms=R.legal.filter(x=>x.to===sq);
  if(ms.length===1){R.sel=null;return playerMove(ms[0]);}

  const M=S.mind,R=S.round,think=R.turnStart?Date.now()-R.turnStart:0;R.turnStart=0;

  if(!said&&hang&&Math.random()<.85)sayK('hang',{piece:p.t});

  if(said)return;
  if(checkStances())return;

  const avg=M.moves?M.think/M.moves:0;
  once('fast',M.moves>=6&&avg>0&&avg<2500);once('slow',M.moves>=4&&avg>15000);
  const fav=Object.entries(M.use).sort((a,b)=>b[1]-a[1])[0];once('fav',!!fav&&fav[1]>=6&&fav[1]/M.moves>=.4,{piece:fav&&fav[0]});

  once('aggro',M.moves>=8&&M.caps/M.moves>=.45);once('passive',M.moves>=10&&M.caps===0);
  if(!said&&res.total<tg*.08&&Math.random()<.25)sayK('small');
  if(!said&&Math.random()<.1){const cb=callbackLine();if(cb)say(cb,'callback');}
}

  else s+=`<ellipse cx="100" cy="14" rx="26" ry="7" fill="none" stroke="${GOLD}" stroke-width="4"/><path d="M96 -2 H104 V28 H96 Z M88 7 H112 V15 H88 Z" fill="${GOLD}"/>`;
  if(st===0||st===1||st===3){s+=`<rect x="63" y="52" width="33" height="17" rx="7" fill="url(#shade)" stroke="${OUT}" stroke-width="3.5"/><rect x="104" y="52" width="33" height="17" rx="7" fill="url(#shade)" stroke="${OUT}" stroke-width="3.5"/><path d="M96 58 H104" stroke="${OUT}" stroke-width="3.5"/>`;
    if(st===3)s+=`<path d="M112 53 L118 60 L114 64 L121 68" fill="none" stroke="#fff" stroke-width="1.6"/>`+eyeSVG(100,40,8+sub,iris)+`<path d="M90 80 H110" stroke="${OUT}" stroke-width="3.5" stroke-linecap="round"/>`;}

  if(st===2)s+=eyeSVG(80,60,8,CYAN)+eyeSVG(120,60,8,CYAN)+`<circle cx="120" cy="60" r="11" fill="none" stroke="${GOLD}" stroke-width="3"/><path d="M131 62 Q138 80 132 96" fill="none" stroke="${GOLD}" stroke-width="1.5"/><path d="M88 80 H112" stroke="${OUT}" stroke-width="3.5" stroke-linecap="round"/>`;

  if(st===5)s+=[[100,38],[72,52],[128,52],[66,74],[134,74],[86,84],[114,84],[100,86]].slice(0,6+sub).map(([x,y])=>eyeSVG(x,y,6,iris)).join('')+eyeSVG(100,62,13,iris);
  if(st===6)s+=[0,1,2].map(i=>`<circle cx="100" cy="62" r="${30-i*4}" fill="none" stroke="${[PINK,GOLD,CYAN][i]}" stroke-width="1.6" opacity=".8"/>`).join('')+eyeSVG(100,62,22,iris)+[[72,44],[128,44],[70,82],[130,82]].slice(0,2+sub).map(([x,y])=>eyeSVG(x,y,5,iris)).join('');

  const R=S.round;$('vig').classList.toggle('on',!!(R&&R.phase!=='over'&&R.phase!=='intro'&&R.movesLeft<=2&&R.score<target()));}

function renderHud(){
  const R=S.round,t=target(),bl=BLINDS[S.blind],sc=R?R.score:0,mv=R?R.movesLeft:0,tot=R?R.movesTotal:baseMoves(),pc=R?R.pc:'w';

function renderBoard(){
  const R=S.round,el=$('board');if(!R){el.innerHTML='';return;}
  const tg=new Map();if(R.sel!=null&&R.phase==='player')for(const m of R.legal)if(m.from===R.sel)tg.set(m.to,m);
  const ck=[];for(const c of['w','b'])if(inCheck(R.board,c))ck.push(kingSq(R.board,c));
  const an=R.anim;R.anim=null;const cands=R.cands||[],bw=VIEW.bottom==='w';
  let h='';
  for(let sq=0;sq<64;sq++){
    const r=sq>>3,f=sq&7,p=R.board[sq],isT=tg.has(sq),cand=cands.includes(sq)||(cands.length>0&&R.candTo===sq);
    let cls='sq '+((r+f)%2?'d':'l')+(isT?' tg':'');
    if(R.lastMove&&(R.lastMove.from===sq||R.lastMove.to===sq))cls+=' last';

function pickTier(w){const tot=Object.values(w).reduce((s,x)=>s+x,0);let r=Math.random()*tot;for(const k in w){r-=w[k];if(r<0)return k;}return'common';}
function rollV(r){const v={};let q=0,n=0;for(const k in r){const[lo,hi,st=1]=r[k];const steps=Math.round((hi-lo)/st),i=Math.floor(Math.random()*(steps+1));v[k]=+(lo+i*st).toFixed(2);q+=steps?i/steps:1;n++;}return{v,q:n?q/n:.5};}
function newPerkInst(ex){const w={common:55,uncommon:30,rare:12,legendary:3+S.ante*.6};let pool=[];
